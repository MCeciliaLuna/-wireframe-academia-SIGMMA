  mini.innerHTML=`
   <div class="stat"><b>${totAg}</b><span>agencias activas</span></div>
   <div class="stat"><b>${totPers}</b><span>personas</span></div>
   <div class="stat"><b>${totMeets}</b><span>Meets generadas</span></div>
   <div class="stat"><b>${totColas}</b><span>dudas en cola</span></div>
   <div class="stat"><b>${CERTIFICADOS.length}</b><span>certificados emitidos</span></div>`;
  w.appendChild(mini);

  /* % de agencias que completaron cada módulo (muestra derivada del plantel) */
  const bak=mapaBAK();
  w.appendChild(el('h2','','Completitud y reprobación por módulo'));
  const tw=el('div','tablewrap');const tb=el('table');
  tb.innerHTML=`<thead><tr><th>Módulo</th><th style="width:120px">Plan</th><th style="width:150px">% completado</th><th style="width:150px">Tasa de reprobación</th><th style="width:130px">Señal</th></tr></thead><tbody>`+
    bak.map(m=>{
      const compl=USO_MUESTRA[m.id]?USO_MUESTRA[m.id][0]:20;
      const repro=USO_MUESTRA[m.id]?USO_MUESTRA[m.id][1]:10;
      const alerta=repro>=20;
      return `<tr data-warn="${alerta}"><td><span class="idbadge">${m.id}</span> ${esc(m.name)}</td>
        <td>${esc(m.tag)}</td>
        <td><div class="row" style="gap:8px"><span class="cellmono">${compl}%</span><div class="bar" style="flex:1;max-width:100px"><i style="width:${compl}%"></i></div></div></td>
        <td><div class="row" style="gap:8px"><span class="cellmono">${repro}%</span><div class="bar ${alerta?'zero':'low'}" style="flex:1;max-width:100px"><i style="width:${Math.min(100,repro*3)}%"></i></div></div></td>
        <td>${alerta?'<span class="tag stop">revisar contenido</span>':'<span class="tag ok">ok</span>'}</td></tr>`;
    }).join('')+'</tbody>';
  tw.appendChild(tb);w.appendChild(tw);

  w.appendChild(el('div','banner warn','<span class="icon" data-icon="alert-triangle"></span><div><b>BAK-M20 (Entidades) reprueba '+USO_MUESTRA['BAK-M20'][1]+' %.</b> Es la señal que el panel existe para dar: no es que las agencias sean flojas, es que "Cliente vs. Pasajero" confunde. Se cruza con el % de acierto por pregunta del banco para encontrar el video a mejorar.</div>'));
  w.appendChild(el('div','note v3','<b>Pantalla nueva ·</b> MVP §6. El ranking de videos más/menos vistos y el volumen de Meets por agencia salen del mismo logueo de eventos que alimenta el avance por agencia.'));
  return w;
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-go2],[data-jump],[data-door],[data-esc],[data-rol],[data-sup],[data-toggle],[data-sel],[data-add],[data-ins],[data-quick],[data-secsave],[data-amsave],[data-tab],[data-bulk],[data-bbulk],[data-imp],[data-impmodo],[data-fix],[data-fixmod],[data-skip],[data-info],[data-perfil],[data-arch],[data-pub],[data-vid-pub],[data-qsave],[data-resort],[data-verres],[data-vercorr],[data-vord],[data-sord],[data-mord],[data-meetag],[data-panelag],[data-meetagendar],#collapseAll');
  if(!t||t.disabled) return;

  if(t.dataset.go){S.screen=t.dataset.go;S.impPaso=1;render();return;}

  if(t.dataset.go2){
    const p=t.dataset.go2.split('|');
    if(p[0]==='altamod'){S.screen='altamod';render();return;}
    if(p[0]==='imp-estr'){S.screen='importar';S.impModo='estructura';S.impPaso=1;S.omit.clear();render();return;}
    if(p[0]==='mod'){S.screen='constructor';S.bModId=p[1];S.open[p[1]]=true;S.sel={kind:'mod',modId:p[1]};S.tab='ficha';render();return;}
    if(p[0]==='banco'){S.screen='banco';S.bModId=p[1];S.bChecked.clear();render();return;}
    if(p[0]==='pregunta'){S.screen='pregunta';S.bModId=p[1];S.qEdit=p[2];render();return;}
    if(p[0]==='subtemas'){S.screen='subtemas';S.bModId=p[1];render();return;}
    if(p[0]==='preview'){S.screen='preview';S.bModId=p[1];S.muestra=null;S.respuestas={};render();return;}
    if(p[0]==='imp-preg'){S.screen='importar';S.impModo='preguntas';S.bModId=p[1];S.impPaso=1;S.omit.clear();render();return;}
  }

  if(t.dataset.jump){
    const p=t.dataset.jump.split('|');
    if(p[0]==='banco'){S.screen='banco';S.bModId=p[1];render();return;}
    if(p[0]==='subtemas'){S.screen='subtemas';S.bModId=p[1];render();return;}
    if(p[0]==='sec'){S.screen='constructor';S.open[p[1]]=true;S.qsec={modId:p[1]};S.sel={kind:'mod',modId:p[1]};render();return;}
    if(p[0]==='vid'){S.screen='constructor';S.open[p[1]]=true;S.sel={kind:'vid',modId:p[1],secIdx:+p[2],vidSeq:p[3]};S.tab='ficha';render();return;}
    if(p[0]==='regr'){S.screen='constructor';S.soloPend=true;DATA.forEach(m=>S.open[m.id]=true);render();toast('Filtro "solo pendiente" activado. Seleccioná los videos y usá la barra de acciones.');return;}
  }

  if(t.dataset.door){
    const d=t.dataset.door;
    if(d==='tengo'){
      if(!can('editar')){toast(porque('editar'));return;}
      S.screen='constructor';const m=findMod('BAK-M40');S.superficie='BAK';S.open[m.id]=true;
      S.quick={modId:m.id,secIdx:0,modo:'tengo'};S.sel=null;render();
      toast('Elegí dónde va el video y pegá el link. Al guardar se verifica el embebido.');return;
    }
    if(d==='preguntas'){
      if(!can('editar')){toast(porque('editar'));return;}
      S.screen='banco';S.bModId='BAK-M40';render();toast('Banco de BAK-M40. El tema es obligatorio en cada pregunta.');return;
    }
    if(d==='estructura'){
      if(!can('editar')){toast(porque('editar'));return;}
      S.screen='altamod';render();return;
    }
    if(d==='publicar'){
      if(!can('publicar')){toast(porque('publicar'));return;}
      S.screen='constructor';S.superficie='BAK';S.bModId='BAK-M30';S.open['BAK-M30']=true;S.sel={kind:'mod',modId:'BAK-M30'};S.tab='publicar';render();return;
    }
  }

  if(t.dataset.esc){S.escena=t.dataset.esc;S.checked.clear();S.bChecked.clear();S.quick=null;S.qsec=null;S.muestra=null;S.respuestas={};if(S.escena==='E1')S.sel=null;render();return;}
  if(t.dataset.rol){S.rol=t.dataset.rol;S.quick=null;S.qsec=null;render();toast('Actuando como '+ROLES[S.rol].n+'. '+ROLES[S.rol].d);return;}
  if(t.dataset.sup){S.superficie=t.dataset.sup;S.sel=null;S.quick=null;S.qsec=null;render();return;}
  if(t.dataset.perfil){S.perfilVista=t.dataset.perfil;render();return;}
  if(t.dataset.meetag){S.meetAg=t.dataset.meetag;render();return;}
  if(t.dataset.panelag){S.panelAg=t.dataset.panelag;render();return;}
  if(t.dataset.meetagendar){const est=cupoEstado(S.meetAg||AGENCIAS[0].id,t.dataset.meetagendar);
    toast(est==='agendado'?'Turno ya agendado. El enlace de esta Meet es propio del turno, no del módulo.':'Agendando la Meet del equipo con la cola como agenda. Se toma un turno de la franja y se genera el enlace.');return;}
  if(t.dataset.toggle){S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];render();return;}
  if(t.id==='collapseAll'){S.open={};S.quick=null;S.qsec=null;render();return;}

  if(t.dataset.sel){
    const [k,mid,si,vs]=t.dataset.sel.split('|');
    S.sel={kind:k,modId:mid,secIdx:si!==undefined?+si:undefined,vidSeq:vs};
    if(k==='mod'){S.open[mid]=true;S.bModId=mid;}
    S.tab='ficha';render();return;
  }

  if(t.dataset.ins){
    const [mid,si,seq]=t.dataset.ins.split('|');
    S.quick={modId:mid,secIdx:+si,modo:'tengo',after:seq};render();
    toast('Insertando después de .'+seq+'. El sistema propone la secuencia intermedia.');return;
  }

  if(t.dataset.add){
    const p=t.dataset.add.split('|');
    if(p[0]==='vid'){S.quick={modId:p[1],secIdx:+p[2],modo:'tengo'};S.qsec=null;render();return;}
    if(p[0]==='sec'){S.screen='constructor';S.open[p[1]]=true;S.qsec={modId:p[1]};S.quick=null;render();return;}
    if(p[0]==='mod'){S.screen='altamod';render();return;}
  }

  /* alta de sección */
  if(t.dataset.secsave){
    const a=t.dataset.secsave;
    if(a==='cancel'){S.qsec=null;render();return;}
    const mod=findMod(S.qsec.modId);
    const nom=($('#snn')&&$('#snn').value.trim())||'Sección sin nombre';
    mod.secciones.push({id:nextSecId(mod),name:nom,videos:[]});
    const idx=mod.secciones.length-1;
    toast('Sección "'+nom+'" creada en '+mod.id+'. Ya acepta videos.');
    if(a==='more'){S.qsec={modId:mod.id};}
    else{S.qsec=null;S.sel={kind:'sec',modId:mod.id,secIdx:idx};S.tab='ficha';}
    render();return;
  }

  /* alta de módulo */
  if(t.dataset.amsave){
    const nombre=($('#anNombre')&&$('#anNombre').value.trim())||'';
    if(!nombre){toast('Falta el nombre del módulo: es el único campo que el sistema no puede derivar.');return;}
    const perfiles=Array.from(document.querySelectorAll('.apPerf')).filter(x=>x.checked).map(x=>x.value);
    const orden=parseInt(($('#anOrden')&&$('#anOrden').value)||nextOrden(S.superficie),10);
    const sec=($('#anSec')&&$('#anSec').value.trim())||'';
    const m=crearModulo({sup:S.superficie,name:nombre,tag:S.amPlan,perfiles,orden,seccion:sec?[sec]:[]});
    toast('Módulo '+m.id+' creado en preparación'+(sec?', con la sección "'+sec+'"':', todavía sin secciones')+'. No lo ve ninguna agencia hasta pasar el checklist.');
    if(t.dataset.amsave==='more'){render();return;}
    S.screen='constructor';S.open[m.id]=true;S.bModId=m.id;S.sel={kind:'mod',modId:m.id};S.tab='ficha';render();return;
  }

  /* alta de video */
  if(t.dataset.quick){
    const a=t.dataset.quick;
    if(a==='cancel'){S.quick=null;render();return;}
    const mod=findMod(S.quick.modId),sec=mod.secciones[S.quick.secIdx];
    const ti=($('#qt')&&$('#qt').value.trim())||'Video sin título';
    const after=S.quick.after;let seq=nextSeq(sec);
    const grabado=S.quick.modo!=='reservar';
    if(after){const ord=videosOrdenados(sec), i=ord.findIndex(v=>v.seq===after);
      const x=parseInt(after,10),y=ord[i+1]?parseInt(ord[i+1].seq,10):x+10;
      seq=String(Math.floor((x+y)/2)).padStart(3,'0');
      /* Entra con un orden intermedio: el ID intercalado y el orden de dictado
         se deciden por separado, aunque acá coincidan. */
      const oa=ordenEfectivo(sec,ord[i]), ob=ord[i+1]?ordenEfectivo(sec,ord[i+1]):oa+10;
      sec.videos.splice(sec.videos.indexOf(ord[i])+1,0,{seq,t:ti,p:'P3',c:'—',dur:grabado?'3:30':'',durEst:grabado?'':'4:00',orden:(oa+ob)/2});
    } else sec.videos.push({seq,t:ti,p:'P3',c:'—',dur:grabado?'3:30':'',durEst:grabado?'':'4:00'});
    toast('Guardado como '+mod.id+'.'+seq+' · no elegiste superficie, módulo, sección ni orden.');
    if(a==='save'){const si=S.quick.secIdx;S.quick=null;S.sel={kind:'vid',modId:mod.id,secIdx:si,vidSeq:seq};S.tab='ficha';}
    else S.quick={modId:mod.id,secIdx:S.quick.secIdx,modo:S.quick.modo};
    render();return;
  }

  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}

  /* reordenamientos reales */
  if(t.dataset.vord){
    const m=findMod(S.sel.modId),sec=m.secciones[S.sel.secIdx];
    const j=permutarVideo(sec,S.sel.vidSeq,t.dataset.vord);
    if(j<0){toast('Ya está en el extremo de la sección.');return;}
    render();toast('Video movido a la posición '+(j+1)+'. El ID no cambió: el orden es un campo aparte del ID.');return;
  }
  if(t.dataset.sord){
    const m=findMod(S.sel.modId),i=S.sel.secIdx;
    const j=t.dataset.sord==='up'?i-1:i+1;
    if(j<0||j>=m.secciones.length){toast('Ya está en el extremo del módulo.');return;}
    const tmp=m.secciones[i];m.secciones[i]=m.secciones[j];m.secciones[j]=tmp;
    S.sel={kind:'sec',modId:m.id,secIdx:j};
    render();toast('Sección movida. Sus videos se movieron con ella y conservan su ID.');return;
  }
  if(t.dataset.mord){
    const m=findMod(S.sel.modId);
    const ord=DATA.filter(x=>x.sup===m.sup).sort((a,b)=>a.orden-b.orden);
    const i=ord.findIndex(x=>x.id===m.id), j=t.dataset.mord==='up'?i-1:i+1;
    if(j<0||j>=ord.length){toast('Ya está en el extremo de la secuencia.');return;}
    const o=m.orden;m.orden=ord[j].orden;ord[j].orden=o;
    render();toast('Módulo movido al orden '+m.orden+'. Cambió la cadena de desbloqueo: revisala arriba.');return;
  }

  if(t.dataset.bulk){
    const a=t.dataset.bulk,n=S.checked.size;
    if(a==='clear'){S.checked.clear();render();return;}
    const msg={regrabar:n+' videos marcados a regrabar. Dos clics en vez de '+n+' recorridos completos.',
      despublicar:n+' videos despublicados. El estado de producción no se tocó: la historia queda intacta.',
      cohorte:'Asignar cohorte a '+n+' videos de una sola vez.',
      mover:'Mover '+n+' videos a otra sección. El ID se mantiene si el módulo no cambia.',
      verificar:'Verificando el embebido de '+n+' videos contra YouTube…',
      archivar:'Archivar '+n+' videos. Conservan ID e historial; el ID no se reutiliza.'}[a];
    toast(msg);S.checked.clear();render();return;
  }

  if(t.dataset.bbulk){
    const a=t.dataset.bbulk,n=S.bChecked.size;
    if(a==='clear'){S.bChecked.clear();render();return;}
    toast({activar:n+' preguntas activadas: ya entran en el sorteo.',
      desactivar:n+' preguntas desactivadas. No se borran: dejan de entrar en el sorteo.',
      subtema:'Asignar tema a '+n+' preguntas de una vez. Es la salida rápida cuando el import entró sin etiqueta.',
      exportar:'Exportando '+n+' preguntas a planilla.'}[a]);
    S.bChecked.clear();render();return;
  }

  if(t.dataset.impmodo){S.impModo=t.dataset.impmodo;S.impPaso=1;S.omit.clear();render();return;}
  if(t.dataset.imp){
    const a=t.dataset.imp;
    if(a==='rev'){S.impPaso=2;render();return;}
    if(a==='back'){S.impPaso=1;S.omit.clear();render();return;}
    if(a==='csv'){toast('También acepta CSV, con mapeo de columnas.');return;}
    if(a==='ok'){
      const p=S.impModo;S.impPaso=1;S.omit.clear();
      if(p==='preguntas'){S.screen='banco';toast('Preguntas importadas en estado borrador. Revisá y activalas para que entren en el sorteo.');}
      else if(p==='videos'){S.screen='constructor';toast('Videos importados. Quedaron en backlog, con su ID reservado.');}
      else{
        /* crea de verdad la estructura FRT del pegado */
        const yaFRT=DATA.some(m=>m.sup==='FRT');
        if(!yaFRT){
          crearModulo({sup:'FRT',name:'Fundamentos del frontend',tag:'P+B',perfiles:[...PERFILES],orden:10,seccion:['Concepto y acceso']});
          crearModulo({sup:'FRT',name:'Reservas del cliente final',tag:'P+B',perfiles:[...PERFILES],orden:20,seccion:['Buscar y reservar','Pagos y confirmación']});
          crearModulo({sup:'FRT',name:'Mi cuenta',tag:'P+B',perfiles:[...PERFILES],orden:30,seccion:['General']});
        }
        S.superficie='FRT';S.screen='constructor';
        DATA.filter(m=>m.sup==='FRT').forEach(m=>S.open[m.id]=true);
        toast('3 módulos FRT creados en preparación, con sus secciones. La fila de CRM quedó esperando confirmación de Producto.');
      }
      render();return;}
  }
  if(t.dataset.fix){toast('Se resuelve la fila sin descartar el resto del pegado.');return;}
  if(t.dataset.fixmod){
    const idm=t.dataset.fixmod;
    if(findMod(idm)){toast('El módulo '+idm+' ya existe.');return;}
    const m=crearModulo({sup:idm.split('-')[0],id:idm,name:'Módulo '+idm+' (nombre a completar)',tag:'P+B',perfiles:[...PERFILES],seccion:['General']});
    FILAS_V.forEach(f=>{if(f[0].indexOf(idm+'.')===0) f[5]=null;});
    toast('Módulo creado como '+m.id+' en preparación, con una sección "General". La fila del pegado quedó lista para importar; falta ponerle nombre real.');
    render();return;
  }
  if(t.dataset.skip){S.omit.add(+t.dataset.skip);render();return;}

  if(t.dataset.arch){
    const w={mod:'módulo',sec:'sección',vid:'video'}[t.dataset.arch];
    toast('Archivar '+w+': se pediría confirmación indicando qué queda fuera de la Academia. Sin borrado físico, el ID se conserva y no se reutiliza.');return;
  }
  if(t.dataset.pub){
    const m=findMod(S.sel.modId);
    m.pubManual=t.dataset.pub==='on';
    render();
    toast(t.dataset.pub==='on'
      ?'Módulo publicado. Registrado: M. Luna, '+new Date().toLocaleDateString('es-AR')+'. Las agencias de los perfiles asignados ya lo ven.'
      :'Módulo despublicado. Los videos conservan su estado de producción; solo dejó de exponerse.');
    return;
  }
  if(t.dataset.vidPub){
    toast(t.dataset.vidPub==='on'?'Video publicado dentro del módulo.':'Video despublicado. Su estado de producción sigue siendo el que era: no se perdió la historia.');
    return;
  }
  if(t.dataset.qsave){
    toast(t.dataset.qsave==='more'
      ?'Pregunta guardada. El formulario vuelve vacío con el mismo tema, que es como se carga un banco de corrido.'
      :'Pregunta guardada en borrador. Activala para que entre en el sorteo y cuente para la cobertura.');
    if(t.dataset.qsave!=='more'){S.screen='banco';render();}
    return;
  }
  if(t.dataset.resort){S.muestra=null;S.respuestas={};S.screen='preview';render();toast('Nuevo sorteo con las mismas reglas. Mirá si cambió la cobertura por tema.');return;}
  if(t.dataset.verres){S.screen='resultado';render();return;}
  if(t.dataset.vercorr!==undefined){S.verCorrectas=t.dataset.vercorr==='1';render();return;}

  if(t.dataset.info==='id'){
    toast('El ID se arma solo: BAK (superficie) + M30 (módulo) + 050 (de diez en diez, para poder intercalar). Es permanente: no cambia ni si regrabás el video.');return;
  }
  if(t.dataset.info==='idmod'){
    toast('El ID del módulo es superficie + número, de diez en diez: BAK-M40, FRT-M00. Para intercalar entre dos módulos se usa un número intermedio, como BAK-M35. Es permanente.');return;
  }
});

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='notesChk'){document.body.classList.toggle('notes-off',!t.checked);return;}
  if(t.id==='soloPend'){S.soloPend=t.checked;render();return;}
  if(t.id==='verArch'){S.verArch=t.checked;render();return;}
  if(t.id==='bSub'){S.bSub=t.value;render();return;}
  if(t.id==='bEstado'){S.bEstado=t.value;render();return;}
  if(t.id==='bCorregir'){S.bCorregir=t.checked;render();return;}
  if(t.dataset&&t.dataset.pv!==undefined){S.respuestas[+t.dataset.pv]=+t.value;return;}
  if(t.dataset&&t.dataset.check!==undefined){t.checked?S.checked.add(t.dataset.check):S.checked.delete(t.dataset.check);render();return;}
  if(t.dataset&&t.dataset.bcheck!==undefined){t.checked?S.bChecked.add(t.dataset.bcheck):S.bChecked.delete(t.dataset.bcheck);render();return;}
  if(t.name==='modo'&&S.quick){S.quick.modo=t.value;render();return;}
  if(t.name==='anPlan'){
    S.amPlan=t.value;
    const n=$('#anNombre')?$('#anNombre').value:'';
    const s=$('#anSec')?$('#anSec').value:'';
    const o=$('#anOrden')?$('#anOrden').value:'';
    render();
    if($('#anNombre'))$('#anNombre').value=n;
    if($('#anSec'))$('#anSec').value=s;
    if($('#anOrden')&&o)$('#anOrden').value=o;
    return;
  }
});

/* --- teclado: árbol navegable con flechas, Escape cancela el alta --- */
function nodos(){return Array.from(document.querySelectorAll('.tree [data-sel]'));}
function refocus(v){const b=document.querySelector('.tree [data-sel="'+v+'"]');if(b)b.focus();}
document.addEventListener('keydown',ev=>{
  const a=document.activeElement;
  const enArbol=a&&a.dataset&&a.dataset.sel!==undefined;
  if(!enArbol){
    if(ev.key==='Escape'&&(S.quick||S.qsec)){ev.preventDefault();const q=S.quick;S.quick=null;S.qsec=null;render();if(q)refocus('sec|'+q.modId+'|'+q.secIdx);}
    return;
  }
  const list=nodos(),i=list.indexOf(a),[kind,mid]=a.dataset.sel.split('|');
  if(ev.key==='ArrowDown'){ev.preventDefault();if(list[i+1])list[i+1].focus();}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(list[i-1])list[i-1].focus();}
  else if(ev.key==='Home'){ev.preventDefault();if(list[0])list[0].focus();}
  else if(ev.key==='End'){ev.preventDefault();if(list[list.length-1])list[list.length-1].focus();}
  else if(ev.key==='ArrowRight'&&kind==='mod'&&!S.open[mid]){ev.preventDefault();S.open[mid]=true;render();refocus(a.dataset.sel);}
  else if(ev.key==='ArrowLeft'&&kind==='mod'&&S.open[mid]){ev.preventDefault();S.open[mid]=false;render();refocus(a.dataset.sel);}
});

document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='filtro'||id==='bFiltro'){
    const pos=ev.target.selectionStart;
    if(id==='filtro') S.filtro=ev.target.value; else S.bFiltro=ev.target.value;
    render();
    const f=$('#'+id);if(f){f.focus();f.setSelectionRange(pos,pos);}
  }
});

render();
</script>
</body>
</html>
