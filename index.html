/* ============================================================
   CONSOLA DE EVALUACIÓN DEL MÓDULO
   ============================================================ */
/* Una sola pantalla para la evaluación de un módulo. Antes lo mismo estaba repartido
   en cinco lugares —dos pestañas de la ficha y tres pantallas propias—, cada uno con
   su propio "volver" a un padre distinto y ninguno en la navegación principal. Acá
   el módulo se elige en el encabezado, así que cargar preguntas en otro módulo dejó
   de exigir salir al árbol de estructura y volver a entrar. */
const EV_TABS=[['banco','Banco'],['cobertura','Cobertura'],['config','Configuración'],['previa','Previsualizar']];

/* Los parámetros que todavía son decisión abierta se muestran como VALOR y no como
   cartel fijo: "a definir" es un estado del dato. */
function valParam(v){
  return v==='si'?'<span class="tag ok">sí</span>'
    :(v==='no'?'<span class="tag">no</span>':'<span class="tag warn">a definir</span>');
}

/* El encabezado responde de un vistazo las cinco preguntas por las que alguien
   entra acá: de qué módulo, cuánto banco hay, si llega al mínimo, si están todos
   los temas cubiertos y si el módulo se puede publicar. */
function evHead(m){
  const p=m.params, nAct=bancoActivas(m).length;
  const cob=cobertura(m), cubiertos=cob.filter(c=>c.n>0).length;
  const chk=checklistPub(m), vis=modVisible(m);
  const mods=modsVis().slice().sort((a,b)=>a.orden-b.orden);
  const falta=Math.max(0,p.minimo-nAct);
  const h=el('div');
  h.innerHTML=`
   <h1>Evaluación del módulo</h1>
   <div class="row" style="margin:0 0 16px">
     <select id="evMod" style="max-width:420px" aria-label="Módulo cuya evaluación se está viendo">
       ${mods.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${x.id} · ${esc(x.name)}</option>`).join('')}</select>
     <span class="chip nodot ${vis?'vis-si':'vis-no'}">${vis?'visible para las agencias':'en preparación'}</span>
     <span style="margin-left:auto"></span>
     <button class="btn btn-sm" data-go2="mod|${m.id}">Ver la ficha del módulo</button>
   </div>
   <div class="dmeta">
     <span class="tag ${nAct<p.minimo?'stop':(nAct<p.objetivo?'warn':'ok')}">${nAct}/${p.objetivo} activas</span>
     <span class="tag ${falta?'stop':'ok'}">mínimo ${p.minimo}${falta?' · faltan '+falta:' · cumplido'}</span>
     <span class="tag ${cubiertos<cob.length?'stop':'ok'}">${cubiertos}/${cob.length} temas cubiertos</span>
     <span class="tag">${p.porIntento} por intento</span>
     <span class="tag">umbral ${esc(p.umbral)}</span>
     <span class="tag ${chk.bloqueado?'stop':'ok'}">${chk.bloqueado?(vis?'publicado y hoy no cumple':'no publicable todavía'):'publicable'}</span>
   </div>`;
  return h;
}

function viewEvaluacion(){
  const m=findMod(S.bModId);
  const w=el('div','wrap');
  w.appendChild(evHead(m));
  if(!EV_TABS.some(t=>t[0]===S.evTab)) S.evTab='banco';
  const tb=tabsBar(EV_TABS,'evtab',S.evTab);tb.classList.add('flush');
  w.appendChild(tb);
  const body=el('div');
  body.setAttribute('role','tabpanel');body.setAttribute('tabindex','0');
  body.style.paddingTop='16px';
  body.appendChild(({banco:panelBanco,cobertura:panelCobertura,config:panelConfig,previa:panelPrevia}[S.evTab])(m));
  w.appendChild(body);
  return w;
}

/* Configuración de ESTE módulo. Los globales son la semilla con la que nace un
   módulo, no un segundo lugar donde editarlos: por eso acá se edita y en
   "Parámetros globales" solo se lee. */
function panelConfig(m){
  const p=m.params, w=el('div');
  const tri=(name,val)=>['si','no','a definir'].map(v=>
    `<label class="radiopill ${val===v?'on':''}"><input type="radio" name="${name}" value="${v}" ${val===v?'checked':''}> ${v==='si'?'sí':v}</label>`).join('');
  w.appendChild(el('p','lede','Los parámetros son de <b>este</b> módulo. Los marcados como regla del MVP no se editan, para que ningún módulo termine con un umbral distinto sin decisión formal.'));

  const card=el('div','card');card.style.padding='16px';
  card.innerHTML=`
   <div class="fieldgrid">
     <div><label>Preguntas por intento</label><div class="ro"><span class="mono">${p.porIntento}</span><span class="lock">regla del MVP</span></div></div>
     <div><label for="pObj">Tamaño objetivo del banco</label>
       <div class="row"><input type="number" id="pObj" value="${p.objetivo}" style="max-width:100px"></div>
       <p class="hint">La meta a la que se apunta. No bloquea la publicación: eso lo hace el mínimo.</p></div>
     <div><label for="pMin">Mínimo duro para publicar</label>
       <div class="row"><input type="number" id="pMin" value="${p.minimo}" style="max-width:100px"></div>
       <p class="hint">No puede bajar de ${3*p.porIntento}, que es 3× el intento: con reintentos ilimitados, un banco chico se memoriza. Tampoco puede superar al objetivo.</p></div>
     <div><label>Umbral de aprobación</label><div class="ro"><span class="mono">${esc(p.umbral)}</span> (${GLOBAL.umbralAprob} de ${p.porIntento})<span class="lock">regla del MVP</span></div></div>
     <div><label>Reintentos permitidos</label><div class="ro">${esc(p.reintentos)}<span class="lock">regla del MVP</span></div></div>
     <div><label>Forzar cobertura por tema en el sorteo</label>
       <div class="radioset">${tri('pForzar',p.forzarCobertura)}</div>
       <p class="hint">Decisión 2, recomendación: sí. Con este módulo alcanza: tiene ${m.subtemas.length} tema${m.subtemas.length===1?'':'s'} y el intento son ${p.porIntento} preguntas, así que ${m.subtemas.length<=p.porIntento?'se puede garantizar una de cada tema':'NO se puede garantizar una de cada tema'}. Se ve funcionando en la pestaña Previsualizar.</p></div>
     <div><label>Mostrar respuestas correctas al finalizar</label>
       <div class="radioset">${tri('pCorr',p.mostrarCorrectas)}</div>
       <p class="hint">Decisión 1, recomendación: no. Define con qué variante abre la pantalla de resultado; las dos siguen estando para comparar.</p></div>
     <div><label>La aprobación caduca si se regraba un video del módulo</label>
       <div class="radioset">${tri('pCaduca',p.caducaAlRegrabar)}</div>
       <p class="hint">Decisión 6. Lo decide quien declara el impacto del regrabado.</p></div>
     <div><label>Al aprobar, habilita</label><div class="ro">El módulo siguiente que aplique al perfil${modSiguiente(m)?': '+modSiguiente(m):''}<span class="lock">se deriva del orden</span></div></div>
   </div>
   <div class="sep"></div>
   <div class="row">
     <button class="btn btn-p" data-pmsave="save">Guardar parámetros</button>
     <button class="btn" data-pmsave="reset">Volver a los valores por defecto</button>
     <span class="hint" style="margin:0">Por defecto: objetivo ${GLOBAL.bancoObjetivo}, mínimo ${GLOBAL.bancoMinimo} y las tres decisiones sin definir.</span>
   </div>`;
  w.appendChild(card);
  w.appendChild(el('div','note v3','<b>Ajuste ·</b> El objetivo y el mínimo se editaban en dos pantallas —acá y en Parámetros globales— sin precedencia definida, y el global no propagaba a los módulos ya creados porque se copiaba una sola vez al iniciar. Ahora el módulo es el único dueño de sus parámetros y el global es la semilla.'));
  return w;
}

/* Las filas que el filtro deja ver. Vive afuera de la vista porque las acciones en
   lote la necesitan igual: una selección tiene que aplicarse sobre lo que la
   persona está viendo, no sobre lo que quedó marcado antes de filtrar. */
function filasBanco(m){
  return bancoVigente(m).filter(q=>{
    if(S.bFiltro&&!q.e.toLowerCase().includes(S.bFiltro.toLowerCase())) return false;
    if(S.bSub==='__none'&&q.st) return false;
    if(S.bSub&&S.bSub!=='__none'&&q.st!==S.bSub) return false;
    if(S.bEstado&&q.estado!==S.bEstado) return false;
    if(S.bCorregir&&!problemas(q).length) return false;
    return true;
  });
}
/* Los IDs seleccionados que además están visibles. */
function selVisible(m){return filasBanco(m).filter(q=>S.bChecked.has(q.id)).map(q=>q.id);}

function panelBanco(m){
  const w=el('div');
  const act=bancoVigente(m);
  const nAct=bancoActivas(m).length;
  const cob=cobertura(m), cero=cob.filter(c=>c.n===0).length;
  const futuro=bancoFuturo(m);

  /* El vacío se resuelve primero: antes esta pantalla mostraba el bloqueo de
     cobertura, la barra en 0 y los filtros de una tabla que no existía, y recién
     al final decía que el banco estaba vacío. Cuatro mensajes para decir uno. */
  if(!act.length){
    w.appendChild(el('div','emptynote','<b>El banco está vacío.</b><br>'
      +(MVP.importador
        ?'Dos caminos: cargar de a una o pegar la planilla. El tema es obligatorio en los dos, '
        :'Las preguntas se cargan de a una, con su tema obligatorio, ')
      +'porque es lo que garantiza que el sorteo de '+m.params.porIntento+' cubra todos los conceptos del módulo.'
      +'<div class="row" style="margin-top:16px"><button class="btn btn-p" data-go2="pregunta|'+m.id+'|new">Agregar la primera pregunta</button>'
      +'<button class="btn" data-go2="imp-preg|'+m.id+'" data-mvp="importador">Pegar desde planilla</button></div>'));
    if(futuro) w.appendChild(el('div','banner plan','<span class="icon" data-icon="info"></span><div>Hay <b>'+futuro+'</b> pregunta'+(futuro>1?'s':'')+' cargada'+(futuro>1?'s':'')+' a mano en un momento posterior. El banco muestra lo que existe con la '+ESCENAS[S.escena].label+'.</div>'));
    return w;

/* Todo lo que hay que corregir en una pregunta, no solo lo primero que aparece.
   Y una pregunta en borrador sin tema NO bloquea la publicación —no cuenta para la
   cobertura hasta que se active—, así que el aviso se dice distinto según el
   estado: antes el filtro "algo para corregir" heredaba ese falso positivo. */
function problemas(q){
  const n=q.ops.filter(o=>o.ok).length;
  const out=[];
  if(!q.st) out.push(q.estado==='activa'
    ?'Sin tema: no cuenta para la cobertura y bloquea la publicación.'
    :'Sin tema: hay que elegirlo antes de activarla.');
  if(q.ops.length<2) out.push('Menos de dos opciones.');
  if(n===0) out.push('Ninguna opción marcada como correcta.');
  if(n>1) out.push('Más de una opción marcada como correcta.');
  return out;
}

/* ============================================================
   ALTA / EDICIÓN DE PREGUNTA
   ============================================================ */
/* Cuatro opciones es lo recomendado por el propio formulario, así que una pregunta
   nueva ya nace con esas cuatro filas. */
function draftDe(q){
  return q
    ? {e:q.e,ops:q.ops.map(o=>({t:o.t,ok:!!o.ok})),st:q.st||'',repaso:q.repaso||'',
       explicacion:q.explicacion||'',estado:q.estado}
    : {e:'',ops:[{t:'',ok:true},{t:'',ok:false},{t:'',ok:false},{t:'',ok:false}],
       st:'',repaso:'',explicacion:'',estado:'borrador'};
}
/* Lee el formulario del DOM a un objeto. Lo usan igual el guardado y las acciones
   que reconstruyen la pantalla —agregar o quitar una opción—, que si no borrarían
   lo que la persona venía tipeando. Mismo criterio que el alta de módulo. */
function leerFormQ(){
  const txt=Array.from(document.querySelectorAll('.optxt')).map(i=>i.value);
  const ok=document.querySelector('.optok:checked');
  const iOk=ok?+ok.value:0;
  const est=document.querySelector('input[name="qest"]:checked');
  return {
    e:($('#qe')&&$('#qe').value.trim())||'',
    ops:txt.map((t,i)=>({t:t.trim(),ok:i===iOk})),
    st:($('#qst')&&$('#qst').value)||'',
    repaso:($('#qrep')&&$('#qrep').value)||'',
    explicacion:($('#qexp')&&$('#qexp').value.trim())||'',
    estado:est?est.value:'borrador'
  };
}
/* Lo que impide guardar, en el orden en que conviene corregirlo. Devuelve null
   cuando está bien. El aviso de enunciado repetido NO bloquea, como dice el hint. */
function validarQ(m,d,id){
  if(!d.e) return 'Falta el enunciado.';
  if(!d.st) return 'Falta el tema: es obligatorio, porque es lo que garantiza que el sorteo cubra todos los conceptos del módulo.';
  const conTexto=d.ops.filter(o=>o.t);
  if(conTexto.length<2) return 'Hacen falta al menos dos opciones con texto.';
  if(conTexto.length!==d.ops.length) return 'Hay opciones vacías: completalas o quitalas.';
  if(d.ops.filter(o=>o.ok).length!==1) return 'Tiene que haber exactamente una opción marcada como correcta.';
  return null;
}

/* ============================================================
   PREVISUALIZAR LA EVALUACIÓN
   ============================================================ */
/* Una pregunta entra en el sorteo si está activa, tiene tema y tiene exactamente
   una correcta: lo demás el examen no lo puede corregir.

   `forzarCobertura` es la decisión 2 y acá se aplica de verdad, no como cartel:
   cuando está en "sí" se reserva una pregunta de cada tema y el resto se completa
   al azar. Solo se puede garantizar si el módulo no tiene más temas que preguntas
   por intento; si los tiene, el sorteo cae al azar puro y la previa lo avisa. */
function sortear(m){
  const pool=bancoActivas(m).filter(q=>q.st&&q.ops.filter(o=>o.ok).length===1);
  const n=m.params.porIntento;
  const copia=pool.slice(), out=[];
  const saca=arr=>arr.splice(Math.floor(Math.random()*arr.length),1)[0];
  if(m.params.forzarCobertura==='si'&&m.subtemas.length<=n){
    m.subtemas.forEach(st=>{
      if(out.length>=n) return;
      const delTema=copia.filter(q=>q.st===st.id);
      if(!delTema.length) return;
      const q=delTema[Math.floor(Math.random()*delTema.length)];
      copia.splice(copia.indexOf(q),1);out.push(q);
    });
  }
  while(out.length<n&&copia.length) out.push(saca(copia));
  /* Se mezcla al final: si no, las reservadas por cobertura salen siempre primero y
     en el mismo orden que los temas. */
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;
}
function panelPrevia(m){
  const w=el('div');
  if(!S.muestra||S.muestra.mod!==m.id){S.muestra={mod:m.id,qs:sortear(m)};S.respuestas={};}
  const qs=S.muestra.qs;
  const usados=[...new Set(qs.map(q=>q.st))];
  const faltan=m.subtemas.filter(s=>!usados.includes(s.id));

  w.appendChild(el('p','lede','Un intento de muestra con las reglas configuradas: '+m.params.porIntento+' preguntas al azar sobre '+bancoActivas(m).length+'. Podés responder; <b>no queda registrado</b>.'));

  if(!qs.length){
    w.appendChild(el('div','emptynote','<b>No hay preguntas activas y válidas para sortear.</b><br>Cargá el banco y revisá que cada pregunta tenga tema y exactamente una opción correcta.'
      +'<div class="row" style="margin-top:16px"><button class="btn btn-p" data-evtab="banco">Ir al banco</button></div>'));
    return w;
  }

  const p=m.params;
  const forzando=p.forzarCobertura==='si';
  const garantizable=m.subtemas.length<=p.porIntento;
  const ctl=el('div','row');ctl.style.marginBottom='16px';
  ctl.innerHTML=`<button class="btn btn-p btn-sm" data-resort="1">Volver a sortear</button>
    <span class="tag">umbral ${esc(p.umbral)}</span><span class="tag">reintentos ${p.reintentos.toLowerCase()}</span>
    <span class="tag ${forzando?(garantizable?'ok':'warn'):(p.forzarCobertura==='no'?'':'warn')}">forzar cobertura: ${p.forzarCobertura==='si'?'sí':esc(p.forzarCobertura)}</span>
    <button class="btn btn-sm" data-evtab="config">Cambiar las reglas</button>`;
  w.appendChild(ctl);

  if(faltan.length) w.appendChild(el('div','banner warn',`<span class="icon" data-icon="alert-triangle"></span><div><b>Este sorteo dejó afuera ${faltan.length} tema${faltan.length>1?'s':''}:</b> ${faltan.map(s=>esc(s.name)).join(', ')}. ${forzando&&!garantizable
    ?'Forzar cobertura está en sí, pero el módulo tiene '+m.subtemas.length+' temas y el intento son '+p.porIntento+' preguntas: no se puede garantizar uno de cada uno.'
    :'Es exactamente el riesgo que resuelve la decisión 2: probá "Volver a sortear" varias veces para ver cuánto varía, y después ponela en sí.'}</div>`));
  else w.appendChild(el('div','banner ok',`<span class="icon" data-icon="check-circle"></span><div>Este sorteo cubrió todos los temas del módulo. ${forzando&&garantizable
    ?'Con forzar cobertura en sí está garantizado en todos los intentos.'
    :'Sin forzar cobertura, no está garantizado en el próximo.'}</div>`));

  qs.forEach((q,i)=>{
    const st=m.subtemas.find(s=>s.id===q.st);
    const c=el('div','qcard');
    c.innerHTML=`<div class="qn">Pregunta ${i+1} de ${qs.length} · ${esc(st?st.name:'sin tema')} · ${q.id}</div>
      <div class="qe">${esc(q.e)}</div>
      ${q.ops.map((o,k)=>`<label class="optrow"><input type="radio" name="pv${i}" data-pv="${i}" value="${k}" ${S.respuestas[i]===k?'checked':''}> <span>${esc(o.t)}</span></label>`).join('')}`;
    w.appendChild(c);
  });

  const resp=Object.keys(S.respuestas).length;
  const f=el('div','row');f.style.marginTop='8px';
  f.innerHTML=`<button class="btn btn-p" data-verres="1">Ver resultado</button>
    <span class="hint" style="margin:0">${resp} de ${qs.length} respondidas. Las sin responder cuentan como error, igual que en la evaluación real.</span>`;
  w.appendChild(f);
  return w;
}

/* ============================================================
   RESULTADO DE LA EVALUACIÓN (pantalla nueva)
   ============================================================ */
function viewResultado(){
  const m=findMod(S.bModId);
  const w=el('div','wrap');
  /* Sin sorteo en curso no hay resultado que mostrar: se vuelve a la previa. */
  if(!S.muestra||S.muestra.mod!==m.id){S.screen='evaluacion';S.evTab='previa';return viewEvaluacion();}
  const qs=S.muestra.qs;
  const total=qs.length;
  let ok=0, sinResp=0;
  const detalle=qs.map((q,i)=>{
    const r=S.respuestas[i];
    if(r===undefined) sinResp++;
    const bien=r!==undefined&&q.ops[r]&&q.ops[r].ok;
    if(bien) ok++;
    return {q,i,r,bien};
  });
  const pct=total?(ok/total*100):0;
  const aprobado=pct>=80;
  const sig=modSiguiente(m);

  /* temas fallados, con su video de repaso */
  const porSub={};
  detalle.forEach(d=>{
    const st=m.subtemas.find(s=>s.id===d.q.st);
    const k=st?st.name:'Sin tema';
    porSub[k]=porSub[k]||{ok:0,tot:0,repasos:new Set()};
    porSub[k].tot++;
    if(d.bien) porSub[k].ok++; else if(d.q.repaso) porSub[k].repasos.add(d.q.repaso);
  });
  const tituloDe=idv=>{
    const seq=idv.split('.')[1];
    const x=vidsDe(m).find(y=>y.v.seq===seq);
    return x?x.v.t:'video del módulo';
  };

  w.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-start">
    <div><h1>Resultado de la evaluación · ${m.id}</h1>
      <p class="lede" style="margin-bottom:16px">Así ve la agencia el resultado. Es una muestra: <b>este intento no se registra</b>.</p></div>
    <button class="btn btn-sm" data-go2="preview|${m.id}"><span class="icon icon-sm" data-icon="arrow-left"></span> Volver al intento</button></div>`;

  const sc=el('div','score');
  sc.innerHTML=`
    <div class="col"><div class="big ${aprobado?'ok':'bad'}">${ok}<span style="font-size:28px;color:var(--muted)">/${total}</span></div>
      <span>respuestas correctas</span></div>
    <div class="col"><div class="pct">${pct.toFixed(2).replace('.',',')} %</div><span>umbral de aprobación: ${m.params.umbral}</span></div>
    <div class="col"><div class="pct">${aprobado?'Aprobado':'No aprobado'}</div><span>${sinResp?sinResp+' sin responder, contadas como error':'todas respondidas'}</span></div>
    <div class="col" style="margin-left:auto"><span>Intento de muestra</span><span>${new Date().toLocaleDateString('es-AR')} · reintentos ${m.params.reintentos.toLowerCase()}</span></div>`;
  w.appendChild(sc);

  if(aprobado){
    w.appendChild(el('div','banner ok',`<span class="icon" data-icon="check-circle"></span><div><b>Módulo aprobado.</b> Se habilita ${sig?'el módulo siguiente que te corresponda ('+sig+')':'el final de la secuencia'} y queda disponible la Meet de ${m.meet.duracion} minutos para dudas puntuales de este módulo.</div>`));
  } else {
    w.appendChild(el('div','banner warn',`<span class="icon" data-icon="alert-triangle"></span><div><b>No alcanzó el 80 %.</b> Se puede volver a intentar sin límite: el próximo intento sortea 10 preguntas nuevas sobre las mismas ${bancoActivas(m).length} del banco. El módulo siguiente sigue trabado hasta aprobar.</div>`));
  }

  /* variante recomendada: por tema + video de repaso */
  const box=el('div','card');box.style.padding='16px';box.style.marginBottom='16px';
  const fallados=Object.keys(porSub).filter(k=>porSub[k].ok<porSub[k].tot);
  box.innerHTML=`<h3>Qué conceptos conviene repasar</h3>
    <p class="hint" style="margin:0 0 8px">Variante recomendada de la decisión 1: no se muestran las respuestas correctas, se muestra <b>dónde</b> falló y <b>qué video</b> lo explica.</p>
    ${fallados.length?`<ul class="sublist">${fallados.map(k=>{
      const s=porSub[k];
      return `<li><div class="lineup"><span>${esc(k)}</span><span class="n">${s.ok} de ${s.tot} correctas</span></div>
        <div class="bar ${s.ok===0?'zero':'low'}"><i style="width:${s.tot?s.ok/s.tot*100:0}%"></i></div>
        ${[...s.repasos].map(rp=>`<div class="vidline" style="margin-top:8px"><span class="icon icon-sm" data-icon="chevron-right"></span> Repasá <span class="mono">${esc(rp)}</span> · ${esc(tituloDe(rp))}</div>`).join('')||'<div class="hint">Ninguna de las preguntas falladas tiene video de repaso asociado: se carga desde el banco.</div>'}</li>`;
    }).join('')}</ul>`
    :'<div class="banner ok" style="margin:0"><span class="icon" data-icon="check-circle"></span><div>Todos los temas del intento salieron correctos.</div></div>'}`;
  w.appendChild(box);

  /* Comparación de variantes. Con qué variante ABRE lo decide el parámetro del
     módulo (decisión 1); el comparador sigue estando para poder mirar la otra sin
     tocar la configuración. */
  const ver=S.verCorrectas===null?m.params.mostrarCorrectas==='si':S.verCorrectas;
  const cmp=el('div','row');cmp.style.marginBottom='8px';
  cmp.innerHTML=`<button class="btn btn-sm ${ver?'':'btn-on'}" data-vercorr="0">Variante A · sin mostrar correctas</button>
    <button class="btn btn-sm ${ver?'btn-on':''}" data-vercorr="1">Variante B · mostrando correctas</button>
    <span class="hint" style="margin:0">${m.params.mostrarCorrectas==='a definir'
      ?'Decisión 1 sin definir: abre con la variante recomendada. Se elige por módulo en Configuración.'
      :'Este módulo está configurado en <b>'+(m.params.mostrarCorrectas==='si'?'sí':'no')+'</b>. Podés mirar la otra variante igual.'}</span>`;
  w.appendChild(cmp);

  if(ver){
    w.appendChild(el('div','banner plan','<span class="icon" data-icon="info"></span><div><b>Variante B.</b> Con reintentos ilimitados, mostrar la correcta convierte el examen en un ejercicio de memoria: la agencia puede fallar, leer las respuestas y aprobar en el intento siguiente sin haber visto un video. Sirve si el objetivo es enseñar en el examen; no sirve si el examen tiene que validar aprendizaje.</div>'));
    detalle.forEach(d=>{
      const c=el('div','qcard');
      const st=m.subtemas.find(s=>s.id===d.q.st);
      c.innerHTML=`<div class="qn">Pregunta ${d.i+1} · ${esc(st?st.name:'sin tema')} · ${d.bien?'<span class="ok">correcta</span>':'<span class="bad">incorrecta</span>'}</div>
        <div class="qe">${esc(d.q.e)}</div>
        ${d.q.ops.map((o,k)=>{
          const esElegida=d.r===k, esOk=o.ok;
          const cls=esOk?'correct':(esElegida?'wrong':'');
          const mk=esOk?'<span class="mkop ok">correcta</span>':(esElegida?'<span class="mkop bad">tu respuesta</span>':'');
          return `<div class="optrow ${cls}"><span>${esc(o.t)}</span>${mk}</div>`;
        }).join('')}
        ${d.q.repaso?`<div class="hint">Video de repaso: <span class="mono">${esc(d.q.repaso)}</span></div>`:''}`;
      w.appendChild(c);
    });
  } else {
    w.appendChild(el('div','banner plan','<span class="icon" data-icon="info"></span><div><b>Variante A, la recomendada.</b> La agencia se lleva el detalle de arriba: qué temas falló y qué video mirar. No ve qué opción era la correcta, así que el reintento exige volver al contenido y no a la memoria.</div>'));
  }

  const acc=el('div','row');acc.style.marginTop='16px';
  acc.innerHTML=`<button class="btn btn-p" data-resort="1">Volver a intentar</button>
    ${aprobado&&sig?`<button class="btn">Ir al módulo siguiente (${sig})</button>`:''}
    ${aprobado&&m.meet.habilitada?`<button class="btn">Agendar la Meet de ${m.meet.duracion} min</button>`:''}
    <button class="btn-q" data-go2="mod|${m.id}">Volver al backoffice</button>`;
  w.appendChild(acc);

  w.appendChild(el('div','banner plan','<span class="icon" data-icon="info"></span><div><b>Qué registra el intento real</b> (esta muestra no registra nada): agencia y usuario, módulo, número de intento, fecha y hora, las 10 preguntas sorteadas con su versión, la respuesta elegida en cada una, la nota y el resultado. Sin la versión de cada pregunta, una nota vieja se vuelve imposible de auditar cuando el banco se edita.</div>'));
  w.appendChild(el('div','note v3','<b>Pantalla nueva v3 ·</b> Era el hueco que dejaba huérfano al campo "video de repaso": existía en el alta de pregunta y no había ninguna pantalla que lo consumiera. Además cierra el circuito de la evaluación —desbloqueo del módulo siguiente y habilitación de la Meet— y deja comparar las dos variantes de la decisión 1 con datos en pantalla en vez de en una discusión.'));
  return w;
}

/* ============================================================
   VER COMO AGENCIA
   ============================================================ */
function viewAgencia(){
  const w=el('div','wrap');
  const p=S.perfilVista;
  w.innerHTML=`<h1>Ver como agencia</h1>
    <p class="lede">Así ve la Academia una agencia de plan ${esc(p)} con la ${esc(ESCENAS[S.escena].label)}. Sirve para revisar antes de publicar, no después.</p>`;
  const sel=el('div','row');sel.style.marginBottom='16px';
  sel.innerHTML=`<span class="hint" style="margin:0">Plan de la agencia:</span>
    ${PERFILES.map(x=>`<button class="btn btn-sm ${p===x?'btn-on':''}" data-perfil="${x}">${x}</button>`).join('')}`;
  w.appendChild(sel);

  const cad=cadena(p); // incluye los fuera de plan, alineado al prototipo
  const delPlan=cad.filter(c=>c.aplica);
  const disponibles=delPlan.filter(c=>c.pub);
  const frame=el('div','agencyframe');
  frame.appendChild(el('div','agencyhead',`<b style="color:var(--ink)">Academia SIGMMA</b> · agencia de ejemplo · plan ${esc(p)}
    <span style="margin-left:auto" class="tag">${disponibles.length} de ${delPlan.length} módulos del recorrido</span>`));

  if(!disponibles.length){
    const e=el('div','modcard');
    e.innerHTML=`<div class="body"><b>Todavía no hay nada publicado para este plan.</b>
      <div class="hint">Una agencia ${esc(p)} entrando hoy vería esta pantalla. Vale la pena mirarla antes de anunciar la Academia.</div></div>`;
    frame.appendChild(e);
  } else {
    let desbloqueado=true, n=0;
    cad.forEach(c=>{
      const m=c.m;
      /* Fuera de plan: se muestra con candado de plan, sin ordinal, y NO entra al recorrido. */
      if(!c.aplica){
        const card=el('div','modcard lock');
        const planIncluye=m.perfiles.join(' + ')||'ningún plan';
        card.innerHTML=`<div class="num"><span class="icon" data-icon="lock"></span></div><div class="body"><b>${esc(m.name)}</b>
          <span class="tag plan" style="margin-left:8px">${esc(m.tag)}</span>
          <div class="hint">No entra en tu plan ${esc(p)}. Incluido en: <b>${esc(planIncluye)}</b>. Para sumarlo, escribile a Soporte. No cuenta para tu avance ni te traba.</div></div>`;
        frame.appendChild(card);
        return;
      }
      /* Aplica pero no publicado todavía. Con publicación en orden esto no deja huecos. */
      if(!c.pub){
        const card=el('div','modcard lock');
        card.innerHTML=`<div class="num">·</div><div class="body"><b>${esc(m.name)}</b>
          <span class="tag" style="margin-left:8px">próximamente</span>
          <div class="hint">Todavía no publicado. Aparece con su número cuando salga.</div></div>`;
        frame.appendChild(card);
        return;
      }
      n++;
      const card=el('div','modcard'+(desbloqueado?'':' lock'));
      const vids=vidsDe(m).filter(x=>!x.v.archivado&&vidVisible(m,x.v));
      const delPlanV=vids.filter(x=>videoAplicable(m,x.v,p));
      card.innerHTML=`<div class="num">${n}</div><div class="body">
        <b>${esc(m.name)}</b>
        ${desbloqueado?'':'<span class="tag" style="margin-left:8px">se desbloquea al aprobar el anterior</span>'}
        ${desbloqueado?`<div class="hint" style="margin-top:4px">${esc(m.resumen||'')}</div>
          <div style="margin-top:8px">${vids.map(x=>{
            const aplica=videoAplicable(m,x.v,p), propio=x.v.tag&&x.v.tag!==m.tag;
            return `<div class="vidline${aplica?'':' off'}">${aplica?ico('chevron-right','icon-sm'):ico('lock','icon-sm')} ${esc(x.v.t)} <span class="hint" style="display:inline">${aplica?esc(x.v.dur):'no entra en tu plan '+esc(p)}${propio?' · <span class="tag plan">'+esc(x.v.tag)+' (plan propio)</span>':''}</span></div>`;
          }).join('')||'<div class="hint">Sin videos visibles.</div>'}
          ${vids.length!==delPlanV.length?`<div class="hint">${delPlanV.length} de ${vids.length} videos entran en tu plan. Los otros no cuentan para tu avance ni para la duración del módulo.</div>`:''}
          <div class="row" style="margin-top:8px"><button class="btn btn-sm btn-p" data-go2="preview|${m.id}">Hacer la evaluación</button>
            <span class="hint" style="margin:0">${m.params.porIntento} preguntas · aprobás con ${m.params.umbral}</span></div>`:''}
      </div>`;
      frame.appendChild(card);
      if(desbloqueado) desbloqueado=false;
    });
  }
  w.appendChild(frame);
  w.appendChild(el('div','note v3','<b>Alineado al prototipo aprobado ·</b> Los módulos <b>fuera de plan se muestran con candado</b> (no se ocultan): además de pedagógico, es una superficie comercial. No tienen ordinal ni cuentan para el avance. El número que ve la agencia es la <b>posición en el recorrido</b>, nunca el ID, y va de 1 a N sin huecos porque la publicación es en orden.'));
  return w;
}

/* El tema se busca por ID y, si no, por nombre. Devuelve cómo se resolvió, porque
   resolver por nombre es una advertencia y no un acierto. */
function resolverTema(m,txt){
  const t=String(txt||'').trim();
  const porId=m.subtemas.find(s=>s.id.toLowerCase()===t.toLowerCase());
  if(porId) return {st:porId,porNombre:false};
  const porNom=m.subtemas.find(s=>s.name.toLowerCase()===t.toLowerCase());
  return porNom?{st:porNom,porNombre:true}:null;
}

/* Valida el pegado contra el módulo destino y devuelve las filas resueltas. El
   error viaja en la fila resuelta, no en el dato de origen: cambiar el destino
   revalida todo. */
function resolverFilasP(m){
  const vistos={};
  return FILAS_P.map(f=>{
    const r={...f};
    const t=resolverTema(m,f.tema);
    r.st=t?t.st.id:null;
    r.temaNombre=t?t.st.name:String(f.tema||'');
    const letra=String(f.correcta||'').trim().toUpperCase();
    const iOk=letra?letra.charCodeAt(0)-65:-1;
    r.ops=f.ops.map((x,k)=>({t:x,ok:k===iOk}));
    const clave=f.e.toLowerCase();
    const repetidaAca=!!vistos[clave]; vistos[clave]=true;
    const yaEnBanco=(m.pool||[]).some(q=>q.e.toLowerCase()===clave);

    if(f.mod&&f.mod!==m.id) r.err='Esta fila es de '+f.mod+' y el destino es '+m.id+'.';
    else if(!t) r.err='El tema "'+esc(String(f.tema||''))+'" no existe en '+m.id+'.';
    else if(!letra) r.err='Sin letra de correcta.';
    else if(iOk<0||iOk>=f.ops.length) r.err='La letra '+letra+' no coincide con ninguna opción cargada.';
    else if(repetidaAca) r.err='Enunciado repetido dentro de este mismo pegado.';
    else if(yaEnBanco) r.err='Aviso: el enunciado ya está en el banco de '+m.id+'. Entra igual.';
    else if(t.porNombre) r.err='Aviso: el tema se resolvió por nombre. Si se renombra la sección, este pegado deja de entrar; conviene pegar el ID.';
    else r.err=null;
    return r;
  });
}

      if(e.indexOf('el destino es')>=0) botones+=`<button class="btn btn-sm" data-fix="dest|${i}">Traer la fila a ${m.id}</button>`;

    }
    const fix=e?`<span class="${aviso?'rowwarn':'rowerr'}">${esc(e)}</span><span class="rowfix">${botones}</span>`:'';

       nombre de la columna con el de la sección, así que un renombre —o un pegado
       de otro módulo— daba +0 en todo y la caja mentía. Y solo suma las que van a
       entrar ACTIVAS, porque las que entran en borrador no cuentan para cobertura. */
    const nuevas={};
    vivas.filter(f=>entran(f)&&f.st&&f.estado==='activa').forEach(f=>{nuevas[f.st]=(nuevas[f.st]||0)+1;});

  if(modo==='videos') w.appendChild(el('div','note v3','<b>Ajuste v3 ·</b> La fila de BAK-M31 antes solo se podía omitir. Ahora ofrece <b>crear el módulo que falta</b> sin abandonar el pegado: es el caso real de una planilla que va más adelantada que la Academia.'));
  return w;
}

function agBy(id){return AGENCIAS.find(a=>a.id===id);}
function nombrePlantel(ag,uid){const e=ag.plantel.find(x=>x.id===uid);return e?e.nombre:'—';}
/* El estado del cupo NO se guarda: se deriva de la cola y del turno. Un estado
   almacenado se desincroniza en cuanto alguien retira una duda.

     sin dudas          → sin-lugares
     dudas, sin turno   → abierto
     turno a futuro     → agendado
     turno ya pasado    → consumido

   No hay `vencido`: la cola no caduca. Es el mismo vocabulario que el prototipo
   aprobado, para que el estado no se llame distinto en cada superficie. */
function cupoEstado(agId,modId){
  const t=(TURNOS[agId]||[]).find(x=>x.modId===modId);
  if(t){const d=parseCuando(t.cuando);return d&&d.getTime()>Date.now()?'agendado':'consumido';}
  const dudas=(COLAS[agId]||[]).filter(d=>d.modId===modId);
  return dudas.length?'abierto':'sin-lugares';
}

  w.appendChild(el('div','note v3','<b>Pantalla nueva de alineación ·</b> El backoffice modelaba la Meet como un link fijo en la ficha del módulo. El modelo aprobado es cupo por agencia con cola de dudas, coordinador y agenda de turnos, y <b>el enlace es por turno</b>. Ya no hay campo de link en la ficha del módulo, y el <b>estado del cupo se deriva</b> de la cola y de la fecha del turno: guardado se desincronizaba en cuanto alguien retiraba una duda.'));

  const card=el('div','card');card.style.padding='16px';
  card.innerHTML=`
   <div class="fieldgrid">
     <div><label>Umbral para marcar un video como "visto"</label><div class="ro"><span class="mono">${GLOBAL.umbralVisto} %</span> de la duración<span class="lock">regla del MVP</span></div></div>
     <div><label>Cómo se mide ese ${GLOBAL.umbralVisto} %</label>
       <div class="radioset">
         <label class="radiopill ${GLOBAL.metodoVisto==='posición'?'on':''}"><input type="radio" name="mv" ${GLOBAL.metodoVisto==='posición'?'checked':''}> Posición máxima alcanzada</label>
         <label class="radiopill ${GLOBAL.metodoVisto!=='posición'?'on':''}"><input type="radio" name="mv" ${GLOBAL.metodoVisto!=='posición'?'checked':''}> Segundos efectivamente reproducidos (anti-scrub)</label>
       </div>
       <p class="hint miss">Decisión abierta P04.3. El prototipo usa posición y avisa que <b>no es el criterio de producción</b>: arrastrar la barra al final marca el video como visto. La API de YouTube alcanza para el criterio estricto — es decisión de producto, no límite técnico.</p></div>
     <div><label>Preguntas por intento</label><div class="ro"><span class="mono">${GLOBAL.preguntasIntento}</span><span class="lock">regla del MVP</span></div></div>
     <div><label>Umbral de aprobación</label><div class="ro"><span class="mono">${GLOBAL.umbralAprob} / 10</span> (80 %)<span class="lock">regla del MVP</span></div></div>
     <div><label>Tamaño del banco con el que nace un módulo</label>
       <div class="ro">mínimo <span class="mono">${GLOBAL.bancoMinimo}</span> · objetivo <span class="mono">${GLOBAL.bancoObjetivo}</span><span class="lock">semilla, no valor vigente</span></div>
       <p class="hint">Alineado a ${GLOBAL.bancoMinimo/GLOBAL.preguntasIntento}× el intento. Es el valor con el que nace un módulo nuevo: <b>el valor vigente lo define cada módulo</b>, en la pestaña Configuración de su evaluación. Editarlo acá no propagaba a lo ya creado, así que dejó de ser editable.</p></div>
     <div><label>Canal único de soporte</label><div class="row"><input type="text" value="${esc(GLOBAL.soporte)}" style="max-width:320px"></div>
       <p class="hint">Un solo canal en toda la Academia, como en el prototipo.</p></div>
     <div><label>Zona horaria de atención</label><div class="ro">${esc(GLOBAL.zona)}<span class="lock">rotulada en pantalla, sin conversión de husos</span></div></div>
     <div><label>Rehacer una evaluación ya aprobada</label>
       <div class="ro">Gana la última nota aprobada; desaprobar después no revoca la aprobación<span class="lock">decisión del prototipo (P05.4)</span></div>
       <p class="hint">Se cruza con la decisión 6 (¿la aprobación caduca al regrabar un video?): las dos definen si una aprobación es permanente o revisable, y conviene escribirlas juntas.</p></div>
   </div>`;
  w.appendChild(card);

  /* Trazabilidad: qué módulos se apartaron de la semilla y en qué. Con los
     parámetros repartidos en dos pantallas, este dato no existía en ninguna. */
  const semilla=p=>p.objetivo===GLOBAL.bancoObjetivo&&p.minimo===GLOBAL.bancoMinimo
    &&p.forzarCobertura==='a definir'&&p.mostrarCorrectas==='a definir'&&p.caducaAlRegrabar==='a definir';
  const propios=DATA.filter(m=>!semilla(m.params));
  const tr2=el('div','card');tr2.style.padding='16px';tr2.style.marginTop='16px';
  tr2.innerHTML=`<h3>Módulos con parámetros propios</h3>
    <p class="hint" style="margin:4px 0 8px">Cada módulo es dueño de sus parámetros. Acá se ve, de una sola mirada, cuáles se apartaron del valor por defecto: es lo que evita que un umbral distinto se cuele sin decisión formal.</p>`;
  if(!propios.length){
    tr2.appendChild(el('div','emptynote','<b>Ninguno se apartó todavía.</b><br>Los '+DATA.length+' módulos corren con objetivo '+GLOBAL.bancoObjetivo+', mínimo '+GLOBAL.bancoMinimo+' y las tres decisiones sin definir.'));
  }else{
    const tw=el('div','tablewrap'),tb=el('table');
    tb.innerHTML=`<thead><tr><th style="width:110px">Módulo</th><th>Nombre</th><th style="width:90px">Objetivo</th><th style="width:90px">Mínimo</th><th style="width:130px">Forzar cobertura</th><th style="width:130px">Mostrar correctas</th><th style="width:120px">Caduca al regrabar</th></tr></thead>`;
    const bd=el('tbody');
    propios.forEach(m=>{
      const p=m.params, tr=el('tr');
      tr.innerHTML=`<td class="cellmono">${m.id}</td><td>${esc(m.name)}</td>
        <td class="cellmono">${p.objetivo}${p.objetivo!==GLOBAL.bancoObjetivo?' <span class="tag warn">propio</span>':''}</td>
        <td class="cellmono">${p.minimo}${p.minimo!==GLOBAL.bancoMinimo?' <span class="tag warn">propio</span>':''}</td>
        <td>${valParam(p.forzarCobertura)}</td><td>${valParam(p.mostrarCorrectas)}</td><td>${valParam(p.caducaAlRegrabar)}</td>`;
      bd.appendChild(tr);
    });
    tb.appendChild(bd);tw.appendChild(tb);tr2.appendChild(tw);
  }
  w.appendChild(tr2);

  w.appendChild(el('div','note v3','<b>Ajuste ·</b> Esta pantalla reúne lo que es global de verdad —umbral de visto y su método, preguntas por intento, umbral de aprobación, canal de soporte y zona horaria— y dejó de editar el mínimo del banco, que ahora vive en cada módulo. Antes el mismo número se editaba en dos lugares sin precedencia definida.'));
  return w;
}


/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-go2],[data-jump],[data-door],[data-esc],[data-sup],[data-toggle],[data-sel],[data-add],[data-ins],[data-quick],[data-modo],[data-secsave],[data-amsave],[data-tab],[data-evtab],[data-pmsave],[data-qnew],[data-bulk],[data-bbulk],[data-imp],[data-impmodo],[data-fix],[data-fixmod],[data-skip],[data-info],[data-perfil],[data-arch],[data-pub],[data-vid-pub],[data-qsave],[data-qopt],[data-qdup],[data-ballcheck],[data-resort],[data-verres],[data-vercorr],[data-vord],[data-sord],[data-mord],[data-meetag],[data-panelag],[data-meetagendar],#collapseAll');
  if(!t||t.disabled) return;

  if(t.dataset.go){S.screen=t.dataset.go;S.impPaso=1;render();return;}

  if(t.dataset.go2){
    const p=t.dataset.go2.split('|');
    if(p[0]==='altamod'){S.screen='altamod';render();return;}
    if(p[0]==='imp-estr'){S.screen='importar';S.impModo='estructura';S.impPaso=1;S.omit.clear();render();return;}
    if(p[0]==='mod'){S.screen='constructor';S.bModId=p[1];S.open[p[1]]=true;S.sel={kind:'mod',modId:p[1]};S.tab='ficha';render();return;}
    if(p[0]==='banco'){S.screen='banco';S.bModId=p[1];S.bChecked.clear();render();return;}
    if(p[0]==='pregunta'){S.screen='pregunta';S.bModId=p[1];S.qEdit=p[2];render();return;}
    if(p[0]==='subtemas'){S.screen='subtemas';S.bModId=p[1];render();return;}
    if(p[0]==='preview'){S.screen='preview';S.bModId=p[1];S.muestra=null;S.respuestas={};S.verCorrectas=null;render();return;}
    if(p[0]==='imp-preg'){S.screen='importar';S.impModo='preguntas';S.bModId=p[1];S.impPaso=1;S.omit.clear();render();return;}
  }

  if(t.dataset.jump){
    const p=t.dataset.jump.split('|');
    /* Mismo efecto que data-go2: entrar al banco desde un pendiente no puede
       arrastrar una selección hecha en otro módulo. */
    if(p[0]==='banco'){S.screen='banco';S.bModId=p[1];S.bChecked.clear();render();return;}
    if(p[0]==='subtemas'){S.screen='subtemas';S.bModId=p[1];render();return;}
    if(p[0]==='sec'){S.screen='constructor';S.open[p[1]]=true;S.qsec={modId:p[1]};S.sel={kind:'mod',modId:p[1]};render();return;}
    if(p[0]==='vid'){S.screen='constructor';S.open[p[1]]=true;S.sel={kind:'vid',modId:p[1],secIdx:+p[2],vidSeq:p[3]};S.tab='ficha';render();return;}
    if(p[0]==='regr'){S.screen='constructor';S.soloPend=true;DATA.forEach(m=>S.open[m.id]=true);render();toast('Filtro "solo pendiente" activado. Seleccioná los videos y usá la barra de acciones.');return;}
  }

  if(t.dataset.door){
    const d=t.dataset.door;
    if(d==='tengo'){
      S.screen='constructor';const m=findMod('BAK-M40');S.superficie='BAK';S.open[m.id]=true;
      S.quick={modId:m.id,secIdx:0,modo:'tengo'};S.sel=null;render();
      toast('Elegí dónde va el video y pegá el link. Al guardar se verifica el embebido.');return;
    }
    if(d==='preguntas'){
      /* Antes esta puerta iba siempre a BAK-M40, hardcodeado: si querías cargar
         preguntas de otro módulo, la única acción directa del hub no servía. Ahora
         abre el módulo con el banco más atrasado, y el selector de la consola deja
         cambiarlo sin volver. */
      const cand=modsVis().filter(x=>!x.enPrep&&x.subtemas.length)
        .sort((a,b)=>(bancoActivas(a).length-a.params.minimo)-(bancoActivas(b).length-b.params.minimo));
      S.bModId=(cand[0]||findMod('BAK-M40')||modsVis()[0]).id;
      S.screen='banco';S.bChecked.clear();render();
      toast('Banco de '+S.bModId+', el más atrasado contra su mínimo. Podés cambiar de módulo arriba. El tema es obligatorio en cada pregunta.');
      return;
    }
    if(d==='estructura'){
      S.screen='altamod';render();return;
    }
    if(d==='publicar'){
      S.screen='constructor';S.superficie='BAK';S.bModId='BAK-M30';S.open['BAK-M30']=true;S.sel={kind:'mod',modId:'BAK-M30'};S.tab='publicar';render();return;
    }
  }

  if(t.dataset.esc){S.escena=t.dataset.esc;S.checked.clear();S.bChecked.clear();S.quick=null;S.qsec=null;S.muestra=null;S.respuestas={};if(!modsVis().length)S.sel=null;render();return;}
  if(t.dataset.sup){S.superficie=t.dataset.sup;S.sel=null;S.quick=null;S.qsec=null;render();return;}
  if(t.dataset.perfil){S.perfilVista=t.dataset.perfil;render();return;}
  if(t.dataset.meetag){S.meetAg=t.dataset.meetag;render();return;}
  if(t.dataset.panelag){S.panelAg=t.dataset.panelag;render();return;}
  if(t.dataset.meetagendar){const est=cupoEstado(S.meetAg||AGENCIAS[0].id,t.dataset.meetagendar);
    toast(est==='agendado'?'Turno ya agendado. El enlace de esta Meet es propio del turno, no del módulo.':'Agendando la Meet del equipo con la cola como agenda. Se toma un turno de la franja y se genera el enlace.');return;}
  if(t.dataset.toggle){S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];render();return;}
  if(t.id==='collapseAll'){S.open={};S.quick=null;S.qsec=null;render();return;}

  if(t.dataset.sel){
    const [k,mid,si,vs]=t.dataset.sel.split('|');
    S.sel={kind:k,modId:mid,secIdx:si!==undefined?+si:undefined,vidSeq:vs};
    if(k==='mod'){S.open[mid]=true;S.bModId=mid;}
    S.tab='ficha';render();return;
  }

  if(t.dataset.ins){
    const [mid,si,seq]=t.dataset.ins.split('|');
    S.quick={modId:mid,secIdx:+si,modo:'tengo',after:seq};render();
    toast('Insertando después de .'+seq+'. El sistema propone la secuencia intermedia.');return;
  }

  if(t.dataset.add){
    const p=t.dataset.add.split('|');
    if(p[0]==='vid'){S.quick={modId:p[1],secIdx:+p[2],modo:'tengo'};S.qsec=null;render();return;}
    if(p[0]==='sec'){S.screen='constructor';S.open[p[1]]=true;S.qsec={modId:p[1]};S.quick=null;render();return;}
    if(p[0]==='mod'){S.screen='altamod';render();return;}
  }

  /* alta de sección */
  if(t.dataset.secsave){
    const a=t.dataset.secsave;
    if(a==='cancel'){S.qsec=null;render();return;}
    const mod=findMod(S.qsec.modId);
    const nom=($('#snn')&&$('#snn').value.trim())||'Sección sin nombre';
    mod.secciones.push({id:nextSecId(mod),name:nom,videos:[]});
    const idx=mod.secciones.length-1;
    toast('Sección "'+nom+'" creada en '+mod.id+'. Ya acepta videos.');
    if(a==='more'){S.qsec={modId:mod.id};}
    else{S.qsec=null;S.sel={kind:'sec',modId:mod.id,secIdx:idx};S.tab='ficha';}
    render();return;
  }

  /* alta de módulo */
  if(t.dataset.amsave){
    const nombre=($('#anNombre')&&$('#anNombre').value.trim())||'';
    if(!nombre){toast('Falta el nombre del módulo: es el único campo que el sistema no puede derivar.');return;}
    const perfiles=Array.from(document.querySelectorAll('.apPerf')).filter(x=>x.checked).map(x=>x.value);
    const orden=parseInt(($('#anOrden')&&$('#anOrden').value)||nextOrden(S.superficie),10);
    const sec=($('#anSec')&&$('#anSec').value.trim())||'';
    const m=crearModulo({sup:S.superficie,name:nombre,tag:S.amPlan,perfiles,orden,seccion:sec?[sec]:[]});
    toast('Módulo '+m.id+' creado en preparación'+(sec?', con la sección "'+sec+'"':', todavía sin secciones')+'. No lo ve ninguna agencia hasta pasar el checklist.');
    if(t.dataset.amsave==='more'){render();return;}
    S.screen='constructor';S.open[m.id]=true;S.bModId=m.id;S.sel={kind:'mod',modId:m.id};S.tab='ficha';render();return;
  }

  /* El estado del video que se está dando de alta. El radio estaba dibujado con su
     `value` y nadie lo leía: `modo` valía siempre 'tengo', así que el formulario no
     ofrecía nunca la rama de duración estimada y el estado `backlog` era inalcanzable. */
  if(t.dataset.modo&&S.quick){S.quick={...S.quick,modo:t.dataset.modo};render();return;}

  /* alta de video */
  if(t.dataset.quick){
    const a=t.dataset.quick;
    if(a==='cancel'){S.quick=null;render();return;}
    const mod=findMod(S.quick.modId),sec=mod.secciones[S.quick.secIdx];
    const ti=($('#qt')&&$('#qt').value.trim())||'Video sin título';
    const after=S.quick.after;let seq=nextSeq(sec);
    const grabado=S.quick.modo!=='reservar';
    if(after){const ord=videosOrdenados(sec), i=ord.findIndex(v=>v.seq===after);
      const x=parseInt(after,10),y=ord[i+1]?parseInt(ord[i+1].seq,10):x+10;
      seq=String(Math.floor((x+y)/2)).padStart(3,'0');
      /* Entra con un orden intermedio: el ID intercalado y el orden de dictado
         se deciden por separado, aunque acá coincidan. */
      const oa=ordenEfectivo(sec,ord[i]), ob=ord[i+1]?ordenEfectivo(sec,ord[i+1]):oa+10;
      sec.videos.splice(sec.videos.indexOf(ord[i])+1,0,{seq,t:ti,p:'P3',c:'—',dur:grabado?'3:30':'',durEst:grabado?'':'4:00',orden:(oa+ob)/2});
    } else sec.videos.push({seq,t:ti,p:'P3',c:'—',dur:grabado?'3:30':'',durEst:grabado?'':'4:00'});
    toast('Guardado como '+mod.id+'.'+seq+' · no elegiste superficie, módulo, sección ni orden.');
    if(a==='save'){const si=S.quick.secIdx;S.quick=null;S.sel={kind:'vid',modId:mod.id,secIdx:si,vidSeq:seq};S.tab='ficha';}
    else S.quick={modId:mod.id,secIdx:S.quick.secIdx,modo:S.quick.modo};
    render();return;
  }

  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.evtab){S.screen='evaluacion';S.evTab=t.dataset.evtab;render();return;}

  /* Cargar una pregunta de un tema puntual, desde donde se ve el hueco. */
  if(t.dataset.qnew){
    const m=findMod(S.bModId);
    S.screen='pregunta';S.qEdit='new';
    S.qDraft={key:m.id+'|new',...draftDe(null),st:t.dataset.qnew};
    render();
    const nom=(m.subtemas.find(s=>s.id===t.dataset.qnew)||{}).name||'';
    toast('Pregunta nueva con el tema "'+nom+'" ya elegido.');
    return;
  }

  /* Parámetros de la evaluación, que son del módulo. Las validaciones protegen las
     reglas ya ratificadas: el mínimo no puede bajar de 3× el intento ni superar al
     objetivo. */
  if(t.dataset.pmsave){
    const m=findMod(S.bModId), p=m.params;
    if(t.dataset.pmsave==='reset'){
      p.objetivo=GLOBAL.bancoObjetivo;p.minimo=GLOBAL.bancoMinimo;
      p.forzarCobertura='a definir';p.mostrarCorrectas='a definir';p.caducaAlRegrabar='a definir';
      render();toast('Parámetros de '+m.id+' vueltos a los valores por defecto: objetivo '+GLOBAL.bancoObjetivo+', mínimo '+GLOBAL.bancoMinimo+'.');
      return;
    }
    const obj=parseInt(($('#pObj')&&$('#pObj').value)||p.objetivo,10);
    const min=parseInt(($('#pMin')&&$('#pMin').value)||p.minimo,10);
    const piso=3*p.porIntento;
    if(!(obj>0)||!(min>0)){toast('El objetivo y el mínimo tienen que ser números mayores que cero.');return;}
    if(min<piso){toast('El mínimo no puede bajar de '+piso+': es 3× las '+p.porIntento+' preguntas del intento, y con reintentos ilimitados un banco más chico se memoriza.');return;}
    if(min>obj){toast('El mínimo no puede superar al objetivo: quedaría un módulo que nunca se puede publicar.');return;}
    const leer=n=>{const x=document.querySelector('input[name="'+n+'"]:checked');return x?x.value:'a definir';};
    p.objetivo=obj;p.minimo=min;
    p.forzarCobertura=leer('pForzar');p.mostrarCorrectas=leer('pCorr');p.caducaAlRegrabar=leer('pCaduca');
    /* Cambiar las reglas invalida el sorteo que estaba en pantalla. */
    S.muestra=null;S.respuestas={};
    const nAct=bancoActivas(m).length;
    render();
    toast('Parámetros de '+m.id+' guardados. '+(nAct<min
      ?'Con '+nAct+' activas queda por debajo del mínimo de '+min+': el módulo no se puede publicar.'
      :'Con '+nAct+' activas cumple el mínimo de '+min+'.'));
    return;
  }

  /* reordenamientos reales */
  if(t.dataset.vord){
    const m=findMod(S.sel.modId),sec=m.secciones[S.sel.secIdx];
    const j=permutarVideo(sec,S.sel.vidSeq,t.dataset.vord);
    if(j<0){toast('Ya está en el extremo de la sección.');return;}
    render();toast('Video movido a la posición '+(j+1)+'. El ID no cambió: el orden es un campo aparte del ID.');return;
  }
  if(t.dataset.sord){
    const m=findMod(S.sel.modId),i=S.sel.secIdx;
    const j=t.dataset.sord==='up'?i-1:i+1;
    if(j<0||j>=m.secciones.length){toast('Ya está en el extremo del módulo.');return;}
    const tmp=m.secciones[i];m.secciones[i]=m.secciones[j];m.secciones[j]=tmp;
    S.sel={kind:'sec',modId:m.id,secIdx:j};
    render();toast('Sección movida. Sus videos se movieron con ella y conservan su ID.');return;
  }
  if(t.dataset.mord){
    const m=findMod(S.sel.modId);
    const ord=DATA.filter(x=>x.sup===m.sup).sort((a,b)=>a.orden-b.orden);
    const i=ord.findIndex(x=>x.id===m.id), j=t.dataset.mord==='up'?i-1:i+1;
    if(j<0||j>=ord.length){toast('Ya está en el extremo de la secuencia.');return;}
    const o=m.orden;m.orden=ord[j].orden;ord[j].orden=o;
    render();toast('Módulo movido al orden '+m.orden+'. Cambió la cadena de desbloqueo: revisala arriba.');return;
  }

  if(t.dataset.bulk){
    const a=t.dataset.bulk,n=S.checked.size;
    if(a==='clear'){S.checked.clear();render();return;}
    const msg={regrabar:n+' videos marcados a regrabar. Dos clics en vez de '+n+' recorridos completos.',
      despublicar:n+' videos despublicados. El estado de producción no se tocó: la historia queda intacta.',
      cohorte:'Asignar cohorte a '+n+' videos de una sola vez.',
      mover:'Mover '+n+' videos a otra sección. El ID se mantiene si el módulo no cambia.',
      verificar:'Verificando el embebido de '+n+' videos contra YouTube…',
      archivar:'Archivar '+n+' videos. Conservan ID e historial; el ID no se reutiliza.'}[a];
    toast(msg);S.checked.clear();render();return;
  }

  if(t.dataset.ballcheck){
    const m=findMod(S.bModId);
    const vis=filasBanco(m).map(q=>q.id);
    const todas=vis.length>0&&vis.every(id=>S.bChecked.has(id));
    vis.forEach(id=>todas?S.bChecked.delete(id):S.bChecked.add(id));
    render();return;
  }
  if(t.dataset.bbulk){
    const m=findMod(S.bModId);
    const a=t.dataset.bbulk;
    if(a==='clear'){S.bChecked.clear();render();return;}
    const ids=selVisible(m);
    if(!ids.length){toast('No hay ninguna pregunta seleccionada entre las que se están viendo.');return;}
    if(a==='exportar'){toast('Exportando '+ids.length+' preguntas a planilla, con ID, tema, opciones, estado y versión.');return;}
    const plural=n=>n===1?'':'s';
    if(a==='activar'){
      const n=qEstado(m,ids,'activa');
      const malas=ids.map(id=>qDe(m,id)).filter(q=>problemas(q).length).length;
      const cero=subtemasEnCero(m);
      S.bChecked.clear();render();
      toast(n+' pregunta'+plural(n)+' activada'+plural(n)+': ya entra'+(n===1?'':'n')+' en el sorteo y cuenta'+(n===1?'':'n')+' para la cobertura.'
        +(malas?' Ojo: '+malas+' tiene'+(malas===1?'':'n')+' algo para corregir, así que el sorteo la'+plural(malas)+' descarta.':'')
        +(cero?' Todavía quedan '+cero+' tema'+plural(cero)+' sin cubrir.':''));
      return;
    }
    const n=qEstado(m,ids,'inactiva');
    S.bChecked.clear();render();
    toast(n+' pregunta'+plural(n)+' desactivada'+plural(n)+'. No se borran —el ID no se reusa—: dejan de entrar en el sorteo.');
    return;
  }

  if(t.dataset.impmodo){S.impModo=t.dataset.impmodo;S.impPaso=1;S.omit.clear();render();return;}
  if(t.dataset.imp){
    const a=t.dataset.imp;
    if(a==='rev'){S.impPaso=2;render();return;}
    if(a==='back'){S.impPaso=1;S.omit.clear();render();return;}
    if(a==='csv'){toast('También acepta CSV, con mapeo de columnas.');return;}
    if(a==='ok'){
      const p=S.impModo;S.impPaso=1;S.omit.clear();
      if(p==='preguntas'){
        /* Importa de verdad: recién así la proyección de cobertura de la pantalla
           anterior es verificable contra el banco. */
        const mod=findMod(S.bModId);
        const listas=resolverFilasP(mod).filter((f,i)=>!S.omit.has(i)&&(!f.err||esAviso(f.err)));
        const antes=bancoActivas(mod).length, cero=subtemasEnCero(mod);
        const n=qImportar(mod,listas);
        const act=listas.filter(f=>f.estado==='activa').length;
        S.screen='banco';S.bChecked.clear();render();
        toast(n+' pregunta'+(n===1?'':'s')+' importada'+(n===1?'':'s')+' en '+mod.id+': '+act+' activa'+(act===1?'':'s')+' y '+(n-act)+' en borrador. '
          +'Activas: '+antes+' → '+bancoActivas(mod).length+'. '
          +(cero&&!subtemasEnCero(mod)?'Se destrabó el bloqueo por cobertura.':(subtemasEnCero(mod)?'Todavía quedan '+subtemasEnCero(mod)+' temas sin cubrir.':'')));
        return;
      }
      else if(p==='videos'){S.screen='constructor';toast('Videos importados. Quedaron en backlog, con su ID reservado.');}
      else{
        /* crea de verdad la estructura FRT del pegado */
        const yaFRT=DATA.some(m=>m.sup==='FRT');
        if(!yaFRT){
          crearModulo({sup:'FRT',name:'Fundamentos del frontend',tag:'P+B',perfiles:[...PERFILES],orden:10,seccion:['Concepto y acceso']});
          crearModulo({sup:'FRT',name:'Reservas del cliente final',tag:'P+B',perfiles:[...PERFILES],orden:20,seccion:['Buscar y reservar','Pagos y confirmación']});
          crearModulo({sup:'FRT',name:'Mi cuenta',tag:'P+B',perfiles:[...PERFILES],orden:30,seccion:['General']});
        }
        S.superficie='FRT';S.screen='constructor';
        DATA.filter(m=>m.sup==='FRT').forEach(m=>S.open[m.id]=true);
        toast('3 módulos FRT creados en preparación, con sus secciones. La fila de CRM quedó esperando confirmación de Producto.');
      }
      render();return;}
  }
  if(t.dataset.fix){
    const p=String(t.dataset.fix).split('|');
    /* Traer la fila al destino sí se resuelve de verdad: cambia el módulo de la
       fila y el pegado se revalida contra los temas del destino. */
    if(p[0]==='dest'&&FILAS_P[+p[1]]){
      const m=findMod(S.bModId);
      FILAS_P[+p[1]].mod=m.id;
      render();toast('Fila traída a '+m.id+'. Se revalidó contra sus temas: si el tema no existe acá, ahora lo dice.');
      return;
    }
    toast('Se resuelve la fila sin descartar el resto del pegado.');return;
  }
  if(t.dataset.fixmod){
    const idm=t.dataset.fixmod;
    if(findMod(idm)){toast('El módulo '+idm+' ya existe.');return;}
    const m=crearModulo({sup:idm.split('-')[0],id:idm,name:'Módulo '+idm+' (nombre a completar)',tag:'P+B',perfiles:[...PERFILES],seccion:['General']});
    FILAS_V.forEach(f=>{if(f[0].indexOf(idm+'.')===0) f[5]=null;});
    toast('Módulo creado como '+m.id+' en preparación, con una sección "General". La fila del pegado quedó lista para importar; falta ponerle nombre real.');
    render();return;
  }
  if(t.dataset.skip){S.omit.add(+t.dataset.skip);render();return;}

  if(t.dataset.arch){
    const w={mod:'módulo',sec:'sección',vid:'video'}[t.dataset.arch];
    toast('Archivar '+w+': se pediría confirmación indicando qué queda fuera de la Academia. Sin borrado físico, el ID se conserva y no se reutiliza.');return;
  }
  if(t.dataset.pub){
    const m=findMod(S.sel.modId);
    m.pubManual=t.dataset.pub==='on';
    render();
    toast(t.dataset.pub==='on'
      ?'Módulo publicado. Registrado: M. Luna, '+new Date().toLocaleDateString('es-AR')+'. Las agencias de los perfiles asignados ya lo ven.'
      :'Módulo despublicado. Los videos conservan su estado de producción; solo dejó de exponerse.');
    return;
  }
  if(t.dataset.vidPub){
    toast(t.dataset.vidPub==='on'?'Video publicado dentro del módulo.':'Video despublicado. Su estado de producción sigue siendo el que era: no se perdió la historia.');
    return;
  }
  /* Opciones de la pregunta: agregar, quitar y elegir la correcta. Antes estos tres
     controles no tenían data-*, así que no entraban por la delegación y el editor
     era decorativo: cuatro opciones fijas y sin poder mover la correcta. */
  if(t.dataset.qopt){
    const [a,i]=t.dataset.qopt.split('|');
    const d={...S.qDraft,...leerFormQ()};
    if(a==='add'&&d.ops.length<5) d.ops.push({t:'',ok:false});
    if(a==='del'&&d.ops.length>2){
      const era=d.ops[+i].ok;
      d.ops.splice(+i,1);
      /* Si se borró la correcta, la primera pasa a serlo: dejar cero correctas
         sería guardar una pregunta que el sorteo descarta sin decir por qué. */
      if(era) d.ops[0].ok=true;
    }
    if(a==='correcta') d.ops=d.ops.map((o,k)=>({...o,ok:k===+i}));
    S.qDraft=d;render();
    if(a==='del'&&d.ops.length===2) toast('Quedaron dos opciones, el mínimo. Para bajar más habría que replantear la pregunta.');
    return;
  }
  if(t.dataset.qdup){
    const m=findMod(S.bModId);
    const d={...S.qDraft,...leerFormQ()};
    const mal=validarQ(m,d);
    if(mal){toast('No se puede duplicar todavía: '+mal);return;}
    const nq=qGuardar(m,{e:d.e+' (copia)',ops:d.ops,st:d.st,repaso:d.repaso,
      explicacion:d.explicacion,estado:'borrador'});
    S.qEdit=nq.id;S.qDraft=null;render();
    toast('Copia guardada como '+nq.id+' en borrador. El ID es nuevo y permanente: no se reusa el de la original.');
    return;
  }
  if(t.dataset.qsave){
    const m=findMod(S.bModId);
    const d={...S.qDraft,...leerFormQ()};
    const mal=validarQ(m,d);
    if(mal){toast(mal);return;}
    const id=S.qEdit==='new'?null:S.qEdit;
    const verAntes=id?(qDe(m,id)||{}).ver:0;
    const repetida=(m.pool||[]).some(x=>x.id!==id&&x.e.toLowerCase()===d.e.toLowerCase());
    const q=qGuardar(m,{e:d.e,ops:d.ops,st:d.st,repaso:d.repaso,
      explicacion:d.explicacion,estado:d.estado},id);
    const dondeEntra=q.estado==='activa'
      ?'Entra en el sorteo y ya cuenta para la cobertura del tema.'
      :'Queda en '+q.estado+': no entra en el sorteo ni cuenta para la cobertura hasta activarla.';
    const aviso=repetida?' Ojo: hay otra pregunta con el mismo enunciado en este módulo.':'';
    if(t.dataset.qsave==='more'){
      /* Se conserva el tema: un banco se carga de corrido, por concepto. */
      S.qEdit='new';S.qDraft={key:m.id+'|new',...draftDe(null),st:d.st};
      render();toast(q.id+' guardada. '+dondeEntra+' El formulario vuelve vacío con el mismo tema.'+aviso);
      return;
    }
    S.qDraft=null;S.screen='banco';render();
    toast(q.id+(q.ver>verAntes&&verAntes?' guardada como v'+q.ver+', porque ya se había respondido. ':' guardada. ')+dondeEntra+aviso);
    return;
  }
  if(t.dataset.resort){S.muestra=null;S.respuestas={};S.verCorrectas=null;S.screen='preview';render();toast('Nuevo sorteo con las mismas reglas. Mirá si cambió la cobertura por tema.');return;}
  if(t.dataset.verres){S.screen='resultado';render();return;}
  if(t.dataset.vercorr!==undefined){S.verCorrectas=t.dataset.vercorr==='1';render();return;}

  if(t.dataset.info==='id'){
    toast('El ID se arma solo: BAK (superficie) + M30 (módulo) + 050 (de diez en diez, para poder intercalar). Es permanente: no cambia ni si regrabás el video.');return;
  }
  if(t.dataset.info==='idmod'){
    toast('El ID del módulo es superficie + número, de diez en diez: BAK-M40, FRT-M00. Para intercalar entre dos módulos se usa un número intermedio, como BAK-M35. Es permanente.');return;
  }
});

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='notesChk'){document.body.classList.toggle('notes-off',!t.checked);return;}
  if(t.id==='soloPend'){S.soloPend=t.checked;render();return;}
  if(t.id==='verArch'){S.verArch=t.checked;render();return;}
  /* Cambiar de módulo sin salir de la consola. Se limpia todo lo que era del módulo
     anterior: filtros, selección y el sorteo de muestra. */
  if(t.id==='evMod'){
    S.bModId=t.value;S.bChecked.clear();S.bFiltro='';S.bSub='';S.bEstado='';S.bCorregir=false;
    S.muestra=null;S.respuestas={};S.qDraft=null;
    render();return;
  }
  if(t.id==='bSub'){S.bSub=t.value;render();return;}
  if(t.id==='bEstado'){S.bEstado=t.value;render();return;}
  if(t.id==='bCorregir'){S.bCorregir=t.checked;render();return;}
  if(t.id==='bBulkTema'&&t.value){
    const m=findMod(S.bModId);
    const ids=selVisible(m);
    const n=qTema(m,ids,t.value);
    const nom=(m.subtemas.find(s=>s.id===t.value)||{}).name||'';
    S.bChecked.clear();render();
    toast(n+' pregunta'+(n===1?'':'s')+' movida'+(n===1?'':'s')+' al tema "'+nom+'". Es la salida rápida cuando un pegado entró sin tema.');
    return;
  }
  if(t.dataset&&t.dataset.pv!==undefined){S.respuestas[+t.dataset.pv]=+t.value;return;}
  if(t.dataset&&t.dataset.check!==undefined){t.checked?S.checked.add(t.dataset.check):S.checked.delete(t.dataset.check);render();return;}
  if(t.dataset&&t.dataset.bcheck!==undefined){t.checked?S.bChecked.add(t.dataset.bcheck):S.bChecked.delete(t.dataset.bcheck);render();return;}
  if(t.name==='modo'&&S.quick){S.quick.modo=t.value;render();return;}
  if(t.name==='anPlan'){
    S.amPlan=t.value;
    const n=$('#anNombre')?$('#anNombre').value:'';
    const s=$('#anSec')?$('#anSec').value:'';
    const o=$('#anOrden')?$('#anOrden').value:'';
    render();
    if($('#anNombre'))$('#anNombre').value=n;
    if($('#anSec'))$('#anSec').value=s;
    if($('#anOrden')&&o)$('#anOrden').value=o;
    return;
  }
});

/* --- teclado: árbol navegable con flechas, Escape cancela el alta --- */
function nodos(){return Array.from(document.querySelectorAll('.tree [data-sel]'));}
function refocus(v){const b=document.querySelector('.tree [data-sel="'+v+'"]');if(b)b.focus();}
document.addEventListener('keydown',ev=>{
  const a=document.activeElement;
  const enArbol=a&&a.dataset&&a.dataset.sel!==undefined;
  if(!enArbol){
    if(ev.key==='Escape'&&(S.quick||S.qsec)){ev.preventDefault();const q=S.quick;S.quick=null;S.qsec=null;render();if(q)refocus('sec|'+q.modId+'|'+q.secIdx);}
    return;
  }
  const list=nodos(),i=list.indexOf(a),[kind,mid]=a.dataset.sel.split('|');
  if(ev.key==='ArrowDown'){ev.preventDefault();if(list[i+1])list[i+1].focus();}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(list[i-1])list[i-1].focus();}
  else if(ev.key==='Home'){ev.preventDefault();if(list[0])list[0].focus();}
  else if(ev.key==='End'){ev.preventDefault();if(list[list.length-1])list[list.length-1].focus();}
  else if(ev.key==='ArrowRight'&&kind==='mod'&&!S.open[mid]){ev.preventDefault();S.open[mid]=true;render();refocus(a.dataset.sel);}
  else if(ev.key==='ArrowLeft'&&kind==='mod'&&S.open[mid]){ev.preventDefault();S.open[mid]=false;render();refocus(a.dataset.sel);}
});

/* El foco y el caret los devuelve render(); acá solo se guarda el filtro. */
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='filtro'||id==='bFiltro'){
    if(id==='filtro') S.filtro=ev.target.value; else S.bFiltro=ev.target.value;
    render();
  }
});

render();
</script>
