  <head>

    <title>BAK-M30 Voucher / Servicios · Backoffice Academia SIGMMA</title>

    <link rel="preload" href="assets/fonts/sofia-sans/SofiaSans-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

  <body>
    <a href="#contenido" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[1001] focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-white">Saltar al contenido</a>

    <div class="app-shell">
      <!-- app-shell: sincronizar con src/partials/app-shell.html -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="assets/img/logo.svg" alt="SIGMMA" width="96" height="16" class="w-[96px]" />
          <span class="text-2xs font-bold text-primary">Academia</span>
        </div>

        <!-- Selector global de superficie. Todo el contenido del backoffice cuelga
             de cuál está activa. Solo BAK tiene módulos mapeados. -->
        <div class="relative" data-dropdown>
          <span class="side-title mb-1 block">Superficie</span>
          <button type="button" class="surface-picker" data-dropdown-trigger aria-expanded="false" aria-haspopup="true">
            <span><strong>BAK</strong> · Backoffice</span>
            <span class="icon icon-sm" data-icon="chevron-down"></span>
          </button>
          <div class="menu" role="menu" data-dropdown-menu hidden>
            <a href="modulos.html?sup=BAK" class="menu-item" role="menuitem">BAK · Backoffice</a>
            <a href="modulos.html?sup=FRT" class="menu-item" role="menuitem">FRT · Front</a>
            <a href="modulos.html?sup=CRM" class="menu-item" role="menuitem">CRM</a>
          </div>
        </div>

        <nav class="flex flex-col gap-4" aria-label="Secciones del backoffice">
          <!-- El punto de partida es Módulos: es la pantalla desde donde se gestiona

               `data-escena-keep` viaja acá porque sin él, entrar a Módulos desde E6

               El alcance del MVP es CREAR y VER módulos, así que de los catorce

               los tres grupos que quedaban enteros en gris no se muestran (D-17). -->
          <div class="nav-group">
            <span class="nav-group-title">Contenido</span>
            <a href="modulos.html" aria-current="page" class="nav-item" data-escena-keep>
              <span class="icon" data-icon="layers"></span>Módulos
            </a>
            <span class="nav-item" aria-disabled="true">
              <span class="icon" data-icon="film"></span>Biblioteca de videos
            </span>
            <a href="tablero.html" class="nav-item">
              <span class="icon" data-icon="columns"></span>Tablero de producción
            </a>
            <span class="nav-item" aria-disabled="true">
              <span class="icon" data-icon="refresh"></span>Cola de regrabación
            </span>
          </div>

          <div class="nav-group">

            <a href="banco.html?m=30" class="nav-item">

            <span class="nav-item" aria-disabled="true">

          <div class="nav-group">

            <span class="nav-item" aria-disabled="true">
              <span class="icon" data-icon="grid"></span>Matriz perfil × módulo
            </span>
          </div>
        </nav>

        <div class="sidebar-foot">
          <span class="text-2xs text-gray-700">Majo · Contenido</span>
        </div>
      </aside>
      <!-- /app-shell -->

      <div class="main-col">
        <header class="page-head">
          <div>
            <div class="breadcrumb" data-breadcrumb></div>
            <h1 class="page-title">
              <span data-titulo></span>
              <span data-chips></span>
              <span class="escena-badge" data-escena-label></span>
            </h1>
          </div>
          <div class="page-actions" data-acciones></div>
        </header>

        <main id="contenido" class="page-body">
          <div id="sin-contenido" class="placeholder-box !py-14" hidden>
            <span class="placeholder-icon" data-icon="layers"></span>
            <h2 class="text-h4" data-vacio-titulo></h2>
            <p class="mt-3 max-w-[60ch] text-base text-gray-700" data-vacio-texto></p>
            <div class="mt-8 flex gap-2" data-vacio-acciones></div>
          </div>

          <!-- Los cinco pasos esenciales del módulo, en un solo lugar. El ciclo
               dura MESES —entre declarar las secciones y escribir las preguntas
               hay un rodaje entero—, así que no es un asistente: es un estado
               que se consulta el día 1 y también el día 90. -->
          <div class="mb-[14px]" data-pasos hidden></div>

          <div id="detalle" class="layout-panel" hidden>
            <div class="flex flex-col gap-[10px]">
              <h2 class="side-title !mb-0" data-arbol-titulo></h2>
              <div data-arbol></div>
              <button type="button" class="placeholder-box !py-3 text-xs" data-agregar-seccion hidden>
                <span class="icon icon-sm" data-icon="plus"></span> agregar sección
              </button>
            </div>

            <!-- Panel de apoyo. Contesta «¿por qué no puedo activar el módulo?»
                 sin que haya que ir a buscarlo a otra pantalla. -->
            <aside class="sticky top-0 flex flex-col gap-3">
              <div data-aptitud></div>
              <div class="side-card">
                <h2 class="side-title">Atajos</h2>
                <ul class="flex flex-col gap-2 text-xs" data-atajos></ul>
              </div>
            </aside>
          </div>
        </main>
      </div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/academia-data.js"></script>
    <script src="assets/js/academia-agencias.js"></script>
    <script src="assets/js/academia-guiones.js"></script>
    <script src="assets/js/academia-preguntas.js"></script>
    <script src="assets/js/academia-sim.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/academia-guia.js"></script>
    <script>
      /* Detalle de módulo. Sirve cualquier `?m=`: los 11 de biblioteca, la Ruta
         Esencial (`R01`) y el ID reservado. El árbol, la aptitud y los atajos se
         derivan del dataset. */
      (function () {
        "use strict";
        const S = window.SIM;
        const R = window.RENDER;
        const e = S.escena;
        const q = e === "E5" ? "" : "?escena=" + e;
        const amp = e === "E5" ? "" : "&amp;escena=" + e;

        const pedido = (S.param("m") || "30").toUpperCase();
        const modulo = S.modulo(pedido === "R01" ? "R01" : Number(pedido));

        function vacio(titulo, texto, acciones) {
          const el = document.getElementById("sin-contenido");
          el.hidden = false;
          el.querySelector("[data-vacio-titulo]").textContent = titulo;
          R.pintar("[data-vacio-texto]", texto);
          R.pintar("[data-vacio-acciones]", acciones || "");
        }

        if (!modulo) {
          document.querySelector("[data-breadcrumb]").innerHTML =
            '<a href="modulos.html' + q + '">Contenido / Módulos</a>';
          vacio("Ese módulo no existe",
            "El mapa de contenido de <strong>BAK</strong> tiene 13 módulos. El que se pidió no es " +
            "ninguno de ellos.",
            '<a href="modulos.html' + q + '" class="btn btn-primary btn-sm">Ver el listado</a>');
          return;
        }

        const r = S.resumenModulo(modulo);
        const esRuta = modulo.tipo === "ruta";

        /* ── Encabezado ─────────────────────────────────────────────────── */
        R.pintar("[data-breadcrumb]",
          '<a href="modulos.html' + q + '">Contenido / Módulos</a> / ' + modulo.codigo);
        R.pintar("[data-titulo]",
          '<span class="id-mono">' + modulo.codigo + "</span> " + R.esc(modulo.titulo));

        const ap = S.aptitud(modulo);
        pintarChips();

        /* Los chips dependen del estado, y el estado se puede cambiar desde
           esta misma pantalla. Se aíslan acá para poder repintarlos solos: el
           árbol y los atajos no cambian al activar. */
        function pintarChips() {
          const rr = S.resumenModulo(modulo);
          const aa = S.aptitud(modulo);
          let chips = '<span class="chip ' +
            (rr.estado === "activo" ? "chip-publicado" : "chip-meta") + '">' + rr.estado + "</span>";
          /* El tipo no se repite cuando el estado ya dice lo mismo: el módulo
             reservado mostraba «reservado reservado». */
          if (modulo.tipo !== rr.estado) {
            chips += '<span class="chip chip-meta">' + modulo.tipo + "</span>";
          }
          /* «Apta para activar» solo se muestra cuando el módulo NO está activo
             todavía: una vez activo, el chip que importa es «activo». */
          if (aa.apto && rr.estado !== "activo") {
            chips += '<span class="chip chip-publicado">' +
              (esRuta ? "apta" : "apto") + " para activar</span>";
          }
          R.pintar("[data-chips]", chips);
        }

        /* ── El módulo reservado no tiene contenido ───────────────────────── */
        if (modulo.tipo === "reservado") {
          R.pintar("[data-acciones]",
            '<a href="alta-seccion.html?m=' + modulo.numero + amp +
            '" class="btn btn-bordered btn-sm">' +
            '<span class="icon" data-icon="plus"></span>Agregar sección</a>');
          vacio("Este módulo es un ID reservado",
            "<span class=\"font-mono\">" + modulo.codigo + "</span> existe en el mapa para que el " +
            "pipeline pueda mirar hacia adelante, pero <strong>el producto todavía no está " +
            "desarrollado</strong>. No tiene secciones ni videos, y no los va a tener hasta que la " +
            "funcionalidad se libere.",
            '<a href="tablero.html' + q + '" class="btn btn-bordered btn-sm">Ver el tablero</a>');
          return;
        }

        /* ── Sin secciones todavía ──────────────────────────────────────── */
        if (!esRuta && modulo.secciones.length === 0) {
          vacio("Este módulo no tiene secciones",
            "Un módulo agrupa sus videos en secciones, y la sección es además la unidad sobre la que " +
            "se exige cobertura de preguntas. Sin al menos una, no hay dónde colgar los videos.",
            '<a href="alta-seccion.html?m=' + modulo.numero + amp +
            '" class="btn btn-primary btn-sm">Crear la primera sección</a>');
          return;
        }

        document.getElementById("detalle").hidden = false;

        /* ── Acciones del encabezado ────────────────────────────────────── */
        const accionActivar = esRuta ? "Activar la Ruta Esencial" : "Activar módulo";
        pintarAcciones();

        function pintarAcciones() {
          const rr = S.resumenModulo(modulo);
          const aa = S.aptitud(modulo);
          let acciones = "";
          if (!esRuta) {
            /* «Agregar sección» y «Agregar video» ya NO están acá: son las
               acciones de los pasos 1 y 2 del tablero, que es donde tienen
               contexto —el paso dice además por qué hay que hacerlo—. Tenerlas
               en los dos lugares sería ofrecer lo mismo dos veces. */
            acciones += '<a href="tablero.html' + q + '" class="btn btn-bordered btn-sm">' +
              '<span class="icon" data-icon="columns"></span>Ver el tablero</a>' +
              '<a href="banco.html?m=' + modulo.numero + amp + '" class="btn btn-bordered btn-sm">' +
              '<span class="icon" data-icon="help-circle"></span>Ver el banco</a>';
          } else {
            acciones += '<a href="banco.html?m=30' + amp + '" class="btn btn-bordered btn-sm">' +
              '<span class="icon" data-icon="help-circle"></span>Ver los bancos de origen</a>';
          }
          /* La ruta no tiene tablero de pasos —no tiene secciones ni videos
             propios (R8)—, así que su botón de activar se queda en el
             encabezado. Los de biblioteca lo tienen en el paso 5. */
          if (esRuta) {
            acciones += rr.estado === "activo"
              ? '<button type="button" class="btn btn-bordered btn-sm" data-desactivar>Desactivar</button>'
              : '<button type="button" class="btn btn-primary btn-sm" data-activar' +
                (aa.apto ? "" : ' disabled aria-describedby="aptitud-motivo"') + ">" +
                accionActivar + "</button>";
          }
          R.pintar("[data-acciones]", acciones);

          /* El paso 5 se lleva el botón de activar: es su acción, y así los
             cinco pasos tienen la suya en el mismo lugar. `cablearActivacion()`
             lo engancha por `[data-activar]`, sin importar dónde se pintó. */
          if (!esRuta) {
            const cajaPasos = document.querySelector("[data-pasos]");
            cajaPasos.hidden = false;
            R.pintar("[data-pasos]", R.tableroPasos(S.pasosDeModulo(modulo, e), {
              activacion: rr.estado === "activo"
                ? '<button type="button" class="btn btn-bordered btn-sm btn-block" data-desactivar>Desactivar</button>'
                : '<button type="button" class="btn btn-primary btn-sm btn-block" data-activar' +
                  /* El desglose entero vive en la tarjeta de aptitud —por eso el
                     `aria-describedby`—, pero el botón lleva igual su motivo:
                     un control apagado y mudo se lee como roto. */
                  (aa.apto ? "" : ' disabled aria-describedby="aptitud-motivo" title="' +
                    R.esc(aa.faltan.length ? "Faltan " + aa.faltan.join(", ") + "."
                      : aa.aRevisar + " preguntas a revisar bloquean la activación.") + '"') + ">" +
                  accionActivar + "</button>",
            }));
          }

          cablearActivacion();
        }

        /* ── Activar / desactivar ─────────────────────────────────────────
           Es la acción bisagra del prototipo: el flujo «camino al lanzamiento»
           termina exactamente acá.

           La aptitud es una compuerta AL MOMENTO de activar, no una condición
           permanente (D-4). Por eso desactivar no la exige: un módulo que dejó
           de cumplirla sigue activo, y sacarlo de circulación tiene que poder
           hacerse igual. */
        function cablearActivacion() {
          const activar = document.querySelector("[data-activar]");
          if (activar) {
            activar.addEventListener("click", function () {
              if (activar.disabled) return;
              S.anotar("modulos", modulo.codigo, { estado: "activo" });
              repintarEstado();
            });
          }
          const desactivar = document.querySelector("[data-desactivar]");
          if (desactivar) {
            desactivar.addEventListener("click", function () {
              S.anotar("modulos", modulo.codigo, { estado: "borrador" });
              repintarEstado();
            });
          }
        }

        /* Lo único que cambia al activar: los chips, las acciones y la tarjeta
           de aptitud —que es donde vive el botón duplicado—. El árbol de
           secciones y los atajos no dependen del estado. */
        function repintarEstado() {
          pintarChips();
          pintarAcciones();
          pintarAptitud();
        }

        /* ── El árbol ───────────────────────────────────────────────────── */
        /* Cuántas preguntas tiene cada video, para los chips del árbol. */
        const preguntasPorVideo = {};
        S.modulos.filter(function (m) { return m.tipo === "biblioteca"; }).forEach(function (m) {
          S.bancoDe(m.numero).forEach(function (p) {
            preguntasPorVideo[p.videoOrigen] = (preguntasPorVideo[p.videoOrigen] || 0) + 1;
          });
        });

        if (esRuta) {
          /* R8: una sección por cohorte de P1, y cada fila dice en qué módulo
             vive la copia canónica del video. */
          const cohortes = S.cohortesConAvance().filter(function (c) {
            return (modulo.referencia.cohortes || []).indexOf(c.id) !== -1;
          });
          document.querySelector("[data-arbol-titulo]").textContent =
            "Los " + r.totalVideos + " videos que referencia · en orden de recorrido";
          R.pintar("[data-arbol]", cohortes.map(function (c, i) {
            return R.seccionRuta(c, i, {
              escena: e === "E5" ? null : e,
              preguntasPorVideo: preguntasPorVideo,
            });
          }).join(""));
        } else {
          document.querySelector("[data-arbol-titulo]").textContent =
            "Árbol de secciones · arrastrar para reordenar";
          const secciones = S.seccionesDe(modulo);
          R.pintar("[data-arbol]", secciones.map(function (s, i) {
            return R.seccionArbol(s, i, { escena: e === "E5" ? null : e });
          }).join(""));
          const agregar = document.querySelector("[data-agregar-seccion]");
          agregar.hidden = false;
          agregar.addEventListener("click", function () {
            window.location.href = "alta-seccion.html?m=" + modulo.numero +
              (e === "E5" ? "" : "&escena=" + e);
          });
        }

        /* ── Aptitud ────────────────────────────────────────────────────── */
        pintarAptitud();

        function pintarAptitud() {
          const rr = S.resumenModulo(modulo);
          const aa = S.aptitud(modulo);
          /* El detalle de por qué hay preguntas a revisar: sin nombrar el video
             que las invalidó, el número no explica nada. */
          let extra = "";
          if (rr.banco.aRevisar > 0 && !esRuta) {
            const porVideo = {};
            S.bancoDe(modulo.numero).forEach(function (p) {
              if (p.estado === "a revisar") porVideo[p.videoOrigen] = (porVideo[p.videoOrigen] || 0) + 1;
            });
            extra = " " + Object.keys(porVideo).sort().map(function (id) {
              const v = S.video(id);
              return "Las " + porVideo[id] + " preguntas de <span class=\"font-mono\">" + id +
                "</span> pasaron a «a revisar» al marcarlo " +
                (v.estado === "obsoleto" ? "obsoleto" : "para regrabar") + ".";
            }).join(" ");
          }
          R.pintar("[data-aptitud]", R.aptitudCard(aa, {
            accion: accionActivar,
            sinBoton: rr.estado === "activo",
            extra: extra,
            motivoApto: esRuta
              ? "Cumple los criterios. La acción de activar está habilitada: es el clic que lanza la Academia."
              : null,
          }));
          /* El botón de la tarjeta es el mismo dato que el del encabezado, así
             que se cablea igual: si solo funcionara uno de los dos, el que no
             responde se leería como roto. */
          const btn = document.querySelector("[data-aptitud] button");
          if (btn && !btn.disabled) {
            btn.addEventListener("click", function () {
              S.anotar("modulos", modulo.codigo, { estado: "activo" });
              repintarEstado();
            });
          }
        }

        /* ── Atajos ─────────────────────────────────────────────────────── */
        const atajos = esRuta
          ? ['<li><a href="modulos.html' + q + '">Volver al listado de módulos ›</a></li>',
             '<li><a href="tablero.html' + q + '">Ver los videos en el tablero ›</a></li>',
             '<li><span class="text-gray-600">Banco derivado · se hereda de los módulos de origen</span></li>']
          /* La configuración de evaluación se hace por modal desde el banco: no
             tiene pantalla propia, así que el atajo lleva ahí. Antes era un
             `<span>` con chevron —parecía un link y no lo era. */
          : ['<li><a href="banco.html?m=' + modulo.numero + amp + '">Ir al banco de preguntas ›</a></li>',
             '<li><a href="tablero.html' + q + '">Ver en el tablero de producción ›</a></li>',
             '<li><a href="banco.html?m=' + modulo.numero + amp +
               '&amp;config=1">Configuración de evaluación ›</a></li>'];
        R.pintar("[data-atajos]", atajos.join(""));
      })();
    </script>
  </body>
</html>
