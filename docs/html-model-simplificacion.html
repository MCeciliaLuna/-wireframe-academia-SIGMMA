<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia SIGMMA · Constructor de contenido (wireframe navegable)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEEEF;
  --surface:#FFFFFF;
  --surface-sunk:#F4F7F7;
  --ink:#16262C;
  --ink-2:#3D5560;
  --muted:#6E838C;
  --line:#D2DCDE;
  --line-soft:#E4EBEC;
  --accent:#0E6A60;
  --accent-soft:#DCEBE8;
  --warn:#A65613;
  --warn-soft:#F6E9D9;
  --stop:#8E3B3B;
  --stop-soft:#F3E2E2;
  --plan:#3C5A9A;
  --plan-soft:#E1E8F4;
  --r:3px;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#CFDCDE;padding:18px 0 24px;display:flex;flex-direction:column}
.brand{padding:0 18px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand strong{display:block;color:#fff;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:#7E979C}
.railgroup{padding:16px 0 4px}
.railgroup h4{margin:0 18px 6px;font-size:10.5px;font-weight:600;color:#6F878C;letter-spacing:.04em}
.railitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 18px;color:#C3D3D6;font-size:13px;border-left:2px solid transparent}
.railitem:hover{background:rgba(255,255,255,.05);color:#fff}
.railitem[aria-current="true"]{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--accent);font-weight:500}
.railitem.off{color:#5D7378;cursor:not-allowed}
.railitem.off:hover{background:none;color:#5D7378}
.railitem .pend{margin-left:auto;font-size:10px;color:#5D7378;border:1px solid #33474D;border-radius:2px;padding:0 4px}
.railfoot{margin-top:auto;padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#7E979C}

.main{display:flex;flex-direction:column;min-width:0}

/* ---------- topbar / escenas ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:500}
.escenas{margin-left:auto;display:flex;align-items:center;gap:8px}
.escenas>span{font-size:11.5px;color:var(--muted)}
.segbar{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg{background:var(--surface);border:0;border-right:1px solid var(--line-soft);padding:4px 9px;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.seg:last-child{border-right:0}
.seg[aria-pressed="true"]{background:var(--ink);color:#fff}
.escena-note{width:100%;font-size:12px;color:var(--muted);padding-top:2px}

/* ---------- generic ---------- */
.wrap{padding:22px;max-width:1180px}
h1{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 22px;max-width:66ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn-p:hover{background:#0B554D;border-color:#0B554D}
.btn-q{background:none;border-color:transparent;color:var(--accent);padding:6px 6px}
.btn-q:hover{border-color:transparent;text-decoration:underline}
.btn-sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.sep{height:1px;background:var(--line-soft);margin:14px 0}
label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=url],select,textarea{
  width:100%;font-family:inherit;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px
}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.mono{font-family:var(--mono)}

/* estado chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st-backlog{background:var(--surface-sunk);color:var(--muted);border-color:var(--line)}
.st-guionado{background:var(--plan-soft);color:var(--plan)}
.st-grabado{background:var(--plan-soft);color:var(--plan)}
.st-editado{background:var(--plan-soft);color:var(--plan)}
.st-publicado{background:var(--accent-soft);color:var(--accent)}
.st-regrabar{background:var(--warn-soft);color:var(--warn)}
.st-obsoleto{background:var(--stop-soft);color:var(--stop)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 5px;background:var(--surface)}
.idbadge{font-family:var(--mono);font-size:12px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--ink-2)}

/* ---------- hub ---------- */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.door{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:block;width:100%}
.door:hover{border-color:var(--accent);background:#FDFEFE}
.door .kicker{font-size:12px;color:var(--muted);margin-bottom:8px}
.door strong{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.door p{margin:0 0 14px;color:var(--ink-2);font-size:13px;max-width:44ch}
.door .who{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-family:var(--mono)}
.stat span{font-size:11.5px;color:var(--muted)}
.tasklist{list-style:none;margin:0;padding:0}
.tasklist li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.tasklist li:last-child{border-bottom:0}
.tasklist .grow{flex:1;min-width:0}
.tasklist .sub{color:var(--muted);font-size:12px}

/* ---------- constructor: tree + detail ---------- */
.split{display:grid;grid-template-columns:minmax(420px,1fr) minmax(360px,460px);gap:0;flex:1;min-height:0}
.treecol{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.treebar{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.treebar input[type=text]{width:190px}
.tree{overflow:auto;padding:6px 0 60px;flex:1}

.node{display:flex;align-items:center;gap:8px;padding:5px 14px;border-left:2px solid transparent;position:relative}
.node:hover{background:var(--surface-sunk)}
.node.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.twist{background:none;border:0;padding:0;width:14px;color:var(--muted);font-size:10px;line-height:1}
.node .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:0;padding:0}
.n-mod{padding-left:12px;font-weight:600;border-top:1px solid var(--line-soft)}
.n-mod:first-child{border-top:0}
.n-sec{padding-left:36px;color:var(--ink-2);font-weight:500}
.n-vid{padding-left:58px}
.n-vid .label{color:var(--ink-2)}
.node.inactive{opacity:.62}
.node.inactive .label{font-style:italic}
.legend-inactive{padding:2px 14px 8px 36px;font-size:11.5px;color:var(--warn)}
.addrow{padding:3px 14px 8px 58px}
.addrow.sec{padding-left:36px}
.addrow.mod{padding-left:12px;padding-bottom:16px}
.addbtn{background:none;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:12px;padding:3px 9px}
.addbtn:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.selbox{width:13px;height:13px;accent-color:var(--accent);flex:none}

/* inline quick form */
.quick{margin:4px 14px 12px 58px;border:1px solid var(--accent);border-radius:var(--r);background:#FBFDFD;padding:12px}
.quick .qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.quick .qhead b{font-size:13px}
.quick .qhead small{color:var(--muted);font-size:11.5px}
.qgrid{display:grid;gap:10px;margin-bottom:10px}
.derived{background:var(--surface-sunk);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 11px;font-size:12px;color:var(--ink-2)}
.derived dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.derived dt{color:var(--muted)}
.derived dd{margin:0}
.radioset{display:flex;gap:8px;flex-wrap:wrap}
.radiopill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
.radiopill input{accent-color:var(--accent);margin:0}
.radiopill.on{border-color:var(--accent);background:var(--accent-soft)}

/* bulk bar */
.bulk{position:sticky;bottom:0;background:var(--ink);color:#fff;padding:9px 14px;display:flex;gap:10px;align-items:center;font-size:13px}
.bulk .btn{background:transparent;border-color:#3B5158;color:#DCE7E9}
.bulk .btn:hover{border-color:#7E979C}
.bulk .count{font-weight:600}
.bulk .x{margin-left:auto}

/* detail panel */
.detail{background:var(--surface-sunk);overflow:auto;min-width:0}
.dhead{padding:16px 18px 0}
.dhead .idline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font-size:16px;margin:0 0 8px;letter-spacing:-.01em}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 18px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.dbody{padding:16px 18px 40px}
.fieldgrid{display:grid;gap:12px}
.ro{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:6px 9px;font-size:13px;color:var(--ink-2)}
.ro .lock{font-size:11px;color:var(--muted)}
.info{border:0;background:var(--line-soft);color:var(--ink-2);border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;text-align:center;padding:0;flex:none}
.checklist{list-style:none;margin:0;padding:0;font-size:13px}
.checklist li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.checklist li:last-child{border-bottom:0}
.checklist .mk{width:14px;flex:none;text-align:center;font-size:12px}
.ok{color:var(--accent)}
.miss{color:var(--warn)}
.emptynote{color:var(--muted);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px}

/* subtemas */
.bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.low i{background:var(--warn)}
.bar.zero i{background:var(--stop)}
.sublist{list-style:none;margin:10px 0 0;padding:0}
.sublist li{padding:8px 0;border-bottom:1px solid var(--line-soft)}
.sublist li:last-child{border-bottom:0}
.sublist .lineup{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.sublist .n{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- importar ---------- */
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px;background:var(--surface)}
.step{flex:1;padding:10px 14px;border-right:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.step:last-child{border-right:0}
.step[data-on="true"]{background:var(--ink);color:#fff}
.step b{display:block;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface-sunk);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr[data-bad="true"] td{background:#FDF6F6}
.cellmono{font-family:var(--mono);font-size:12px}
.rowerr{color:var(--stop);font-size:11.5px;display:block;margin-top:3px}
.rowfix{display:inline-flex;gap:6px;margin-top:5px}
.tablewrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.summary{display:flex;gap:16px;align-items:center;padding:12px 0;font-size:13px}
.summary .ok b,.summary .bad b{font-family:var(--mono)}

/* toast */
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);font-size:13px;max-width:340px;box-shadow:0 6px 18px rgba(22,38,44,.18);z-index:50}
.toast.hide{display:none}

/* annotation flags (wireframe notes) */
.note{background:#FFFBEF;border:1px solid #E8DCB8;border-left:3px solid #C9A227;border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:#5C4A15;margin:14px 0}
.note b{color:#3F3210}
.notesToggle{font-size:12px}
body.notes-off .note{display:none}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .split{grid-template-columns:1fr}
  .treecol{border-right:0;border-bottom:1px solid var(--line)}
  .doors,.mini{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ======== RAIL ======== -->
  <nav class="rail" aria-label="Navegación principal">
    <div class="brand">
      <strong>Academia SIGMMA</strong>
      <span>Backoffice de contenido</span>
    </div>

    <div class="railgroup">
      <h4>Empezar</h4>
      <button class="railitem" data-go="hub" aria-current="true">Qué querés hacer</button>
    </div>

    <div class="railgroup">
      <h4>Contenido</h4>
      <button class="railitem" data-go="constructor">Estructura de la Academia</button>
      <button class="railitem" data-go="importar">Cargar desde planilla</button>
    </div>

    <div class="railgroup">
      <h4>Seguimiento</h4>
      <button class="railitem off" disabled>Avance por agencia <span class="pend">después</span></button>
      <button class="railitem off" disabled>Panel general <span class="pend">después</span></button>
    </div>

    <div class="railfoot">
      Wireframe navegable · no guarda datos<br>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px;color:#7E979C;font-weight:400" class="notesToggle">
        <input type="checkbox" id="notesChk" checked style="accent-color:#0E6A60"> Ver notas de diseño
      </label>
    </div>
  </nav>

  <!-- ======== MAIN ======== -->
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb">Academia SIGMMA</div>
      <div class="escenas">
        <span>Momento de la Academia</span>
        <div class="segbar" role="group" aria-label="Escena de construcción">
          <button class="seg" data-esc="E1" aria-pressed="false">E1</button>
          <button class="seg" data-esc="E2" aria-pressed="false">E2</button>
          <button class="seg" data-esc="E3" aria-pressed="false">E3</button>
          <button class="seg" data-esc="E4" aria-pressed="true">E4</button>
          <button class="seg" data-esc="E5" aria-pressed="false">E5</button>
        </div>
      </div>
      <div class="escena-note" id="escenaNote"></div>
    </header>

    <div id="screens"></div>
  </div>
</div>

<div class="toast hide" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   DATOS — módulos BAK reales del mapa de grabación
   ========================================================= */
const PERFILES = ['Corporate','Business','Standard'];

const DATA = [

   ]}
 ]},
 {id:'BAK-M30', name:'Voucher / Servicios', tag:'P+B', active:true, perfiles:PERFILES, subtemas:['Concepto de voucher','Carga','Margen','Impuestos','Procesar','Estados','Modelos'], secciones:[
   {name:'Voucher y cobro', videos:[
     {seq:'010', t:'Qué es el voucher: perfil operativo y administrativo', p:'P1', c:'C03', dur:'3:00'},
     {seq:'020', t:'Cargar voucher: tipo, subtipo, proveedor', p:'P1', c:'C03', dur:'4:50'},
     {seq:'050', t:'Procesar el voucher: impacto en la cuenta del proveedor', p:'P1', c:'C03', dur:'2:40'}
   ]},
   {name:'Margen e impuestos', videos:[

  E1:{label:'E1 · Día cero', note:'Nada cargado todavía. Así ve la pantalla la primera persona que entra.'},
  E2:{label:'E2 · IDs reservados', note:'Los 55 videos existen como IDs en backlog. Ninguno grabado, ningún banco de preguntas armado.'},
  E3:{label:'E3 · Guionando y grabando', note:'Los de Prioridad 1 están entre guionados y grabados. El resto sigue en backlog.'},
  E4:{label:'E4 · Ruta esencial publicada', note:'Los 12 videos de P1 están publicados: una agencia ya puede hacer una reserva completa. P2 en producción.'},
  E5:{label:'E5 · En régimen', note:'Todo publicado. Aparece lo que era invisible antes: la cola de "a regrabar" cuando cambia el producto.'}
};

/* estado por escena (derivado, para no duplicar data) */
function estadoDe(mod, vid, esc){
  if(!mod.active) return 'backlog';
  const p = vid.p;
  if(esc==='E2') return 'backlog';
  if(esc==='E3') return p==='P1' ? (vid.seq<'030'?'grabado':'guionado') : 'backlog';
  if(esc==='E4') return p==='P1' ? 'publicado' : (p==='P2' ? 'guionado' : 'backlog');
  if(esc==='E5'){
    const regrabar = ['BAK-M30.020','BAK-M40.010','BAK-M20.010'];
    return regrabar.includes(mod.id+'.'+vid.seq) ? 'a regrabar' : 'publicado';
  }
  return 'backlog';
}
function preguntasDe(mod, esc){
  if(esc==='E1'||esc==='E2') return 0;
  if(esc==='E3') return mod.id==='BAK-M00'?12:0;
  if(esc==='E4'){
    const listos = {'BAK-M00':50,'BAK-M10':50,'BAK-M20':50,'BAK-M30':38,'BAK-M40':22};
    return listos[mod.id]||0;
  }
  return mod.active?50:0;
}

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.remove('hide');
  clearTimeout(toast._id); toast._id=setTimeout(()=>t.classList.add('hide'),3600);
}
const stClass = s => 'st-'+s.replace(/\s+/g,'').replace('aregrabar','regrabar');

function modulosVisibles(){
  if(S.escena==='E1') return [];
  return DATA;
}
function findMod(id){ return DATA.find(m=>m.id===id); }
function vidId(mod,v){ return mod.id+'.'+v.seq; }
function nextSeq(sec){
  const nums = sec.videos.map(v=>parseInt(v.seq,10));
  const max = nums.length?Math.max(...nums):0;
  return String(max+10).padStart(3,'0');
}

function render(){
  $('#escenaNote').textContent = ESCENAS[S.escena].note;
  document.querySelectorAll('.seg').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.esc===S.escena)));
  document.querySelectorAll('.railitem[data-go]').forEach(b=>b.setAttribute('aria-current', String(b.dataset.go===S.screen)));
  const crumbs = {hub:'Qué querés hacer', constructor:'Contenido › Estructura de la Academia', importar:'Contenido › Cargar desde planilla'};
  $('#crumb').innerHTML = '<b>'+ESCENAS[S.escena].label+'</b> · '+crumbs[S.screen];
  const host = $('#screens'); host.innerHTML='';
  if(S.screen==='hub') host.appendChild(viewHub());
  if(S.screen==='constructor') host.appendChild(viewConstructor());
  if(S.screen==='importar') host.appendChild(viewImportar());
}

   ========================================================= */
function viewHub(){

  mods.forEach(m=>m.secciones.forEach(s=>s.videos.forEach(v=>{

    if(e==='publicado')pub++; if(e==='a regrabar')regr++;

  w.innerHTML = `
    <h1>¿Qué querés hacer?</h1>
    <p class="lede">Elegí por la tarea, no por la tabla. El sistema se ocupa de los IDs, la superficie y el orden.</p>`;

  w.appendChild(doors);

  if(mods.length===0){
    w.appendChild(el('div','emptynote','<b>La Academia está vacía.</b><br>Empezá cargando la estructura de módulos desde la planilla maestra, o creá el primer módulo a mano.<div class="row" style="margin-top:12px"><button class="btn btn-p" data-go="importar">Cargar desde planilla</button><button class="btn" data-go="constructor">Crear el primer módulo</button></div>'));

    return w;
  }

  const mini = el('div','mini');
  mini.innerHTML = `
    <div class="stat"><b>${total}</b><span>videos en el mapa</span></div>
    <div class="stat"><b>${pub}</b><span>publicados</span></div>
    <div class="stat"><b>${sinLink}</b><span>todavía sin grabar</span></div>
    <div class="stat"><b>${regr}</b><span>marcados a regrabar</span></div>`;
  w.appendChild(mini);

  const list = el('div','card');
  list.innerHTML = `<div style="padding:12px 14px;border-bottom:1px solid var(--line-soft)"><h3 style="margin:0">Lo que está esperando algo</h3></div>`;
  const ul = el('ul','tasklist');
  const items = [];
  if(regr) items.push(['Hay '+regr+' videos marcados a regrabar','Salieron cambios de producto que los dejaron viejos','Ver la cola']);
  const modsIncompletos = mods.filter(m=>m.active && preguntasDe(m,S.escena)>0 && preguntasDe(m,S.escena)<50);
  modsIncompletos.slice(0,2).forEach(m=>items.push([m.id+' · banco incompleto', preguntasDe(m,S.escena)+' de 50 preguntas cargadas','Completar banco']));
  if(sinLink) items.push([sinLink+' videos esperan grabación','Están reservados con ID y guion pendiente','Ver plan de rodaje']);
  items.forEach(([a,b,c])=>{
    const li=el('li'); li.innerHTML=`<span class="grow"><b style="font-weight:500">${esc(a)}</b><br><span class="sub">${esc(b)}</span></span><button class="btn btn-sm" data-go="constructor">${esc(c)}</button>`;

  }

  mods.forEach(mod=>{

    const pregs = preguntasDe(mod,S.escena);

    // ---- nodo módulo
    const n = el('div','node n-mod'+(mod.active?'':' inactive')+(isSel('mod',mod.id)?' sel':''));

    tree.appendChild(n);

    if(!isOpen) return;

    if(!mod.active){
      tree.appendChild(el('div','legend-inactive','Módulo inactivo: no se muestra a las agencias y no acepta videos nuevos hasta activarlo.'));
    }

    mod.secciones.forEach((sec,si)=>{
      const ns = el('div','node n-sec'+(mod.active?'':' inactive')+(isSel('sec',mod.id,si)?' sel':''));

          <span class="chip ${stClass(e)}">${e}</span>`;
        tree.appendChild(nv);
      });

      // alta de video en contexto
      if(mod.active){
        if(S.quick && S.quick.modId===mod.id && S.quick.secIdx===si){

function isSel(kind,modId,secIdx,vidSeq){
  const s=S.sel; if(!s||s.kind!==kind||s.modId!==modId) return false;
  if(kind==='mod') return true;
  if(s.secIdx!==secIdx) return false;
  if(kind==='sec') return true;
  return s.vidSeq===vidSeq;
}

    const wrap=el('div','dbody');
    wrap.appendChild(el('div','emptynote','Elegí un módulo, una sección o un video del árbol para ver y editar su ficha.'));
    wrap.appendChild(el('div','note','<b>Nota de diseño ·</b> Maestro-detalle: la estructura queda siempre visible a la izquierda mientras editás a la derecha. Nunca perdés de vista dónde estás parada.'));
    d.appendChild(wrap); return d;
  }
  const mod = findMod(S.sel.modId);
  if(S.sel.kind==='mod') return detailModulo(d,mod);
  if(S.sel.kind==='sec') return detailSeccion(d,mod,mod.secciones[S.sel.secIdx]);
  return detailVideo(d,mod,mod.secciones[S.sel.secIdx]);
}

  }
  d.appendChild(b); return d;

function repartir(total,n){
  const out=new Array(n).fill(0); let left=total, i=0;
  const objetivo = Math.ceil(50/n);
  while(left>0 && i<n*3){ const k=i%n; const add=Math.min(objetivo-out[k], left, 3); if(add>0){out[k]+=add; left-=add;} i++; }
  return out;
}

}

document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-go],[data-door],[data-esc],[data-toggle],[data-sel],[data-add],[data-quick],[data-tab],[data-bulk],[data-imp],[data-fix],[data-skip],[data-info],#collapseAll');
  if(!t) return;

  if(t.dataset.go){ S.screen=t.dataset.go; S.importPaso=1; render(); return; }

  if(t.dataset.door){
    S.screen='constructor';
    const mod = DATA.find(m=>m.id==='BAK-M40') || DATA[0];
    S.open[mod.id]=true;
    S.quick={modId:mod.id, secIdx:0, modo: t.dataset.door==='tengo'?'tengo':'reservar'};
    S.sel=null;
    render();
    toast(t.dataset.door==='tengo' ? 'Elegí dónde va el video y pegá el link.' : 'Reservá el ID ahora; el link se carga cuando exista el video.');
    return;
  }

  if(t.dataset.esc){ S.escena=t.dataset.esc; S.checked.clear(); S.quick=null; if(S.escena==='E1'){S.sel=null;} render(); return; }

  if(t.dataset.toggle){ const id=t.dataset.toggle; S.open[id]=!S.open[id]; render(); return; }

  if(t.id==='collapseAll'){ S.open={}; S.quick=null; render(); return; }

  if(t.dataset.sel){
    const [kind,modId,secIdx,vidSeq]=t.dataset.sel.split('|');
    S.sel={kind,modId,secIdx:secIdx!==undefined?+secIdx:undefined,vidSeq};
    if(kind==='mod') S.open[modId]=true;
    S.tab='ficha';
    render(); return;
  }

  if(t.dataset.add){
    const parts=t.dataset.add.split('|');
    if(parts[0]==='vid'){ S.quick={modId:parts[1],secIdx:+parts[2],modo:'tengo'}; render(); return; }
    if(parts[0]==='sec'){ toast('Alta de sección: se abriría con el módulo '+parts[1]+' ya fijado.'); return; }
    if(parts[0]==='mod'){ toast('Alta de módulo: pide nombre, plan y perfiles. El ID lo propone el sistema.'); return; }
  }

  if(t.dataset.quick){
    const a=t.dataset.quick;
    if(a==='cancel'){ S.quick=null; render(); return; }
    const mod=findMod(S.quick.modId), sec=mod.secciones[S.quick.secIdx];
    const titulo=($('#qt')&&$('#qt').value.trim())||'Video sin título';
    const seq=nextSeq(sec);
    sec.videos.push({seq,t:titulo,p:'P3',c:'—',dur:'',_nuevo:true});
    toast('Guardado como '+mod.id+'.'+seq+' · no tuviste que elegir superficie, módulo, sección ni orden.');
    if(a==='save'){ S.quick=null; S.sel={kind:'vid',modId:mod.id,secIdx:S.quick?S.quick.secIdx:0,vidSeq:seq}; }
    render(); return;
  }

  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }

  if(t.dataset.bulk){
    const a=t.dataset.bulk;
    if(a==='clear'){ S.checked.clear(); render(); return; }
    const n=S.checked.size;
    if(a==='regrabar'){ toast(n+' videos marcados a regrabar. Dos clics en vez de '+n+' recorridos completos.'); }
    if(a==='publicado'){ toast(n+' videos publicados.'); }
    if(a==='cohorte'){ toast('Asignar cohorte a '+n+' videos de una sola vez.'); }
    if(a==='mover'){ toast('Mover '+n+' videos a otra sección, manteniendo su ID.'); }
    S.checked.clear(); render(); return;
  }

  if(t.dataset.imp){
    const a=t.dataset.imp;
    if(a==='demo'){ S.importPaso=2; render(); return; }
    if(a==='back'){ S.importPaso=1; S.omitidas.clear(); render(); return; }
    if(a==='csv'){ toast('También acepta CSV, con mapeo de columnas.'); return; }
    if(a==='ok'){ S.importPaso=1; S.omitidas.clear(); S.screen='constructor'; render(); toast('Videos importados. Quedaron en backlog, con su ID reservado.'); return; }
  }

  if(t.dataset.fix){ toast('Se abriría la fila para corregirla, sin descartar el resto del pegado.'); return; }
  if(t.dataset.skip){ S.omitidas.add(+t.dataset.skip); render(); return; }

  if(t.dataset.info==='id'){
    toast('El ID se arma solo: BAK (la superficie) + M30 (el módulo donde está) + 050 (de diez en diez, para poder intercalar). Es permanente: no cambia ni si regrabás el video.');
    return;
  }
});

document.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.id==='notesChk'){ document.body.classList.toggle('notes-off', !t.checked); return; }
  if(t.id==='soloPend'){ S.soloPend=t.checked; render(); return; }
  if(t.dataset && t.dataset.check!==undefined){
    const id=t.dataset.check;
    t.checked?S.checked.add(id):S.checked.delete(id);
    render(); return;
  }
  if(t.name==='modo'){ S.quick.modo=t.value; render(); return; }
});

document.addEventListener('input', ev=>{
  if(ev.target.id==='filtro'){
    S.filtro=ev.target.value;
    const pos=ev.target.selectionStart;
    render();
    const f=$('#filtro'); if(f){f.focus(); f.setSelectionRange(pos,pos);}
  }
});

render();
</script>
</body>
</html>
